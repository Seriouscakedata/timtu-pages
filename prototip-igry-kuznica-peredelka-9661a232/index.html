<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кузница · Изумрудная кузня</title>
<meta name="description" content="Кузница — живописная мастерская в древе: сундук, ковка клинка, поломка и продажа с анимацией и звуком каждого действия.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Кузница · вариант IV «Изумрудная кузня». Живописная сцена из артов Nano Banana,
   интерфейс — тёплое дерево, бронза и изумрудное стекло; никаких пиксельных шрифтов и рамок. */
:root {
  color-scheme: dark;
  --night: #0c0b09;
  --wood: #2a1c12;
  --wood-2: #3b2818;
  --glass: #0e1a17e8;
  --line: #e9c37a3d;
  --text: #fbf3e2;
  --muted: #cbbfa8;
  --gold: #ffd36b;
  --gold-deep: #d9902a;
  --bronze: #b98345;
  --green: #4fe39a;
  --green-deep: #0d6b44;
  --red: #ff6a58;
  --display: "Philosopher", "Georgia", serif;
  --num: "Nunito", "Segoe UI", system-ui, sans-serif;
  --ui: "Nunito", "Segoe UI", system-ui, sans-serif;
  --panel-h: 252px;
  --head-h: 100px;
}
* { box-sizing: border-box; }
html, body { background: var(--night); }
body { margin: 0; color: var(--text); font: 15px/1.4 var(--ui); min-height: 100svh; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 60% 45% at 50% 28%, #2fe0a014, transparent 70%), radial-gradient(ellipse 50% 40% at 20% 85%, #ff8a2a12, transparent 70%); }
button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
img { user-select: none; -webkit-user-drag: none; }

.page { position: relative; padding-inline: 16px; padding-block: 10px 18px; }
.page-head { max-width: 1840px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.page-title h1 { margin: 0; font: 700 24px/1 var(--display); color: var(--gold); text-shadow: 0 2px 0 #4a2a0c, 0 0 18px #ffb43a40; }
.page-title p { margin: 4px 0 0; color: #9fe9c4; font-size: 12.5px; letter-spacing: .04em; }
.views { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: #1a120c; border: 1px solid var(--line); }
.views a { display: grid; place-items: center; min-height: 44px; padding: 0 14px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap; transition: color .15s, background-color .15s, transform .15s; }
.views a:hover { color: var(--text); background: #2a1d12; }
.views a:active { transform: scale(.96); }
.views a[aria-current] { color: #2a1806; background: linear-gradient(#ffe7a0, #e9a640); box-shadow: inset 0 1px 0 #fff6c8, 0 2px 0 #6a3c0e; }
:focus-visible { outline: 3px solid #fff2c4; outline-offset: 2px; }

/* ---------- Сцена ---------- */
#game-root { position: relative; max-width: 430px; margin: 0 auto; }
.stage { position: relative; height: clamp(540px, calc(100svh - 128px), 900px); border-radius: 22px; overflow: hidden; background: #120d0a; border: 2px solid #5a3b1f; box-shadow: 0 0 0 1px #000, 0 0 0 4px #1d140c, 0 0 0 5px #b9834566, 0 30px 80px #000c; isolation: isolate; }
.stage::after { content: ""; position: absolute; inset: 0; border-radius: 20px; pointer-events: none; box-shadow: inset 0 0 0 1px #ffe3a826, inset 0 0 40px #0008; z-index: 5; }
.scene-canvas, .fx-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene-canvas { z-index: 0; }
.fx-canvas { z-index: 4; pointer-events: none; }
.hud { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; pointer-events: none; }
.hud button, .hud a { pointer-events: auto; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 18px; background: linear-gradient(#0e0906f0, #0e090600); }
.brand { display: flex; align-items: center; gap: 8px; font: 700 17px/1 var(--display); letter-spacing: .1em; color: #f6e2b8; text-shadow: 0 2px 2px #000; }
.brand-emblem { width: 32px; height: 32px; filter: drop-shadow(0 2px 3px #000a); }
.wallet { position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 5px; border-radius: 999px; background: linear-gradient(#2b1d12f2, #1a110bf2); border: 1px solid #e9c37a77; box-shadow: inset 0 1px 0 #ffe7ad33, 0 4px 14px #0009; min-width: 0; max-width: 62%; }
.wallet small { display: block; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; line-height: 1.1; }
.wallet strong { display: block; font: 900 18px/1.05 var(--num); color: #fff3d6; white-space: nowrap; font-variant-numeric: tabular-nums; overflow: hidden; }
.wallet-text { min-width: 0; }
.coin-icon { width: 30px; height: 30px; flex-shrink: 0; display: grid; place-items: center; }
.coin-icon img { width: 28px; height: 28px; display: block; filter: drop-shadow(0 1px 2px #000a); animation: coin-turn 3s ease-in-out infinite; }
.wallet.pulse { animation: wallet-pulse .32s ease-out; }
.wallet.pulse .coin-icon img { animation: coin-flip .45s ease-out; }

.head-wrap { position: relative; height: var(--head-h); margin-top: -10px; }
.headline { position: absolute; inset: 0; transition: opacity .18s ease, transform .18s ease; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; text-align: center; padding: 0 14px; }
.head-wrap.show-banner .headline { opacity: 0; transform: scale(.94); }
.eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #e6dcc6; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
.mult, .title { font-weight: 700; line-height: 1; white-space: nowrap; max-width: 100%; display: block; }
.mult { font: 900 56px/1 var(--num); letter-spacing: -.01em; background: linear-gradient(#fffbe6 0 25%, #ffd36b 55%, #e98f1f); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #5a300a) drop-shadow(0 0 16px #ffb43a66); font-variant-numeric: tabular-nums; }
.stage[data-phase="sharpened"] .mult { background-image: linear-gradient(#f2fff7 0 25%, #7dffb6 55%, #1fb565); filter: drop-shadow(0 3px 0 #08381d) drop-shadow(0 0 16px #3dfc9c66); }
.title { font-family: var(--display); font-size: 38px; color: #fff3d6; text-shadow: 0 3px 0 #3a2410, 0 0 20px #ffb43a55, 0 0 2px #000; }
.title.bad { color: #ff8a78; text-shadow: 0 3px 0 #4a0d08, 0 0 24px #ff4b3e66; }
.meta { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; color: #f0e7d4; }
.chip { padding: 3px 10px; border-radius: 999px; background: #140e09d9; border: 1px solid #ffffff22; white-space: nowrap; box-shadow: 0 2px 6px #0008; }
.chip.chance { border-color: #4fe39a88; color: #c3f9dc; }
.stage.tension .chip.chance { animation: heartbeat .5s ease-in-out infinite; }
.chip.gold { border-color: #ffd36b88; color: #ffe7ad; }

.focus { position: relative; flex: 1; min-height: 0; }
.banner-slot { position: absolute; inset: -6px 0 0; display: grid; place-items: start center; pointer-events: none; }
.banner { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; animation: banner-slam 1.5s cubic-bezier(.2,.9,.2,1) both; }
.banner b { font: 700 44px/1.05 var(--display); white-space: nowrap; color: #fff; text-shadow: 0 4px 0 #000a, 0 0 28px currentColor; }
.banner span { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; background: #140e09e6; border: 1px solid #ffffff26; color: #f6efe2; }
.banner.good b { color: #8affc1; }
.banner.bad b { color: #ff7a6a; transform: rotate(-4deg); }
.banner.bad { animation-name: banner-stamp; }
.banner.gold b { color: #ffd36b; font-family: var(--num); font-weight: 900; }
.banner.steel b { color: #e8f4ff; font-size: 34px; }

/* ---------- Нижняя панель ---------- */
.panel { position: relative; height: var(--panel-h); flex-shrink: 0; padding: 30px 14px 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; background: linear-gradient(#140d0800, #140d08e8 34px, #1a110b 100%); }
.panel::before { content: ""; position: absolute; left: 10px; right: 10px; top: 24px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #b9834588 15%, #ffd36b 50%, #b9834588 85%, transparent); box-shadow: 0 0 10px #ffb43a55; }
.panel::after { content: ""; position: absolute; left: 50%; top: 17px; width: 16px; height: 16px; transform: translateX(-50%) rotate(45deg); background: linear-gradient(135deg, #7dffb6, #0f8a54); border: 2px solid #ffd36b; box-shadow: 0 0 12px #4fe39a99; }
.panel.enter > * { animation: rise .42s cubic-bezier(.2,.9,.25,1.1) both; animation-delay: calc(var(--i, 0) * 70ms); }

.setup { display: grid; gap: 7px; }
.field-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #e6dcc6; margin-bottom: 3px; }
.field-label em { font-style: normal; letter-spacing: .04em; text-transform: none; color: #b9f7d2; }
.stake { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 6px; }
.step, .stake-value { height: 44px; border-radius: 12px; }
.step { border: 1px solid #e9c37a66; background: linear-gradient(#4a3220, #2e1f14); color: #ffe7ad; font: 800 24px/1 var(--ui); box-shadow: inset 0 1px 0 #ffe7ad33, 0 3px 0 #0b0704; transition: transform .1s, filter .15s, box-shadow .1s; }
.step:not(:disabled):hover { filter: brightness(1.18); }
.step:not(:disabled):active { transform: translateY(2px); box-shadow: inset 0 1px 0 #ffe7ad33, 0 1px 0 #0b0704; }
.step:disabled { opacity: .4; cursor: default; }
.stake-value { position: relative; overflow: hidden; display: grid; place-items: center; background: #0f0a07; border: 1px solid #e9c37a66; font: 900 22px/1 var(--num); color: #fff3d6; font-variant-numeric: tabular-nums; box-shadow: inset 0 2px 8px #000c; }
.stake-value .num { display: block; white-space: nowrap; }
.stake-value .ghost { position: absolute; inset: 0; display: grid; place-items: center; }
.segments { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 3px; border-radius: 13px; background: #0f0a07; border: 1px solid #ffffff1c; }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 10px; background: linear-gradient(#5a3a1c, #3a2614); border: 1px solid #ffd36b; box-shadow: inset 0 1px 0 #ffe7ad55, 0 0 14px #ff8a2a44; transform: translateX(calc(var(--idx) * 100%)); }
.segment { position: relative; z-index: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #d4c9b4; font-weight: 800; font-size: 14px; border-radius: 9px; transition: color .2s, transform .1s; }
.segment[aria-pressed="true"] { color: #ffe7ad; }
.segment:not(:disabled):hover { color: #fff3d6; }
.segment:not(:disabled):active { transform: scale(.95); }
.segment:focus-visible { outline-offset: -3px; }

.btn { position: relative; overflow: hidden; border-radius: 16px; border: 2px solid #1a0f06; min-height: 64px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: var(--ui); transition: transform .1s ease, filter .15s ease, box-shadow .1s ease; }
.btn:not(:disabled):hover { filter: brightness(1.08) saturate(1.05); transform: translateY(-1px); }
.btn:not(:disabled):active { transform: translateY(4px); }
.btn:disabled { cursor: default; }
.btn:focus-visible { outline: 3px solid #fff2c4; outline-offset: 3px; }
.btn > * { position: relative; z-index: 1; }
.btn span { font-size: 14px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
.btn b { font: 900 28px/1 var(--num); white-space: nowrap; max-width: 100%; overflow: hidden; }
.btn small { font-size: 12.5px; font-weight: 800; opacity: .95; }
.btn::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 34%; left: -50%; background: linear-gradient(100deg, transparent, #ffffff55, transparent); transform: skewX(-18deg); z-index: 0; pointer-events: none; }
.btn-open::after, .btn-upgrade::after { animation: shimmer 3.2s ease-in-out infinite; }
.btn .ripple { position: absolute; z-index: 0; border-radius: 50%; background: #fff; pointer-events: none; transform: translate(-50%, -50%) scale(0); animation: ripple .5s ease-out forwards; }
.btn-icon { position: absolute !important; pointer-events: none; filter: drop-shadow(0 2px 2px #0009); }

.btn-open { flex-direction: row; gap: 10px; min-height: 64px; padding-left: 62px; color: #2a1806; background: linear-gradient(#ffeaa6, #ffc650 55%, #e08c25); box-shadow: inset 0 2px 0 #fff8d6, inset 0 -3px 0 #a8641a, 0 5px 0 #5a320c, 0 0 26px #ffb43a44; animation: cta-glow 2.4s ease-in-out infinite; }
.btn-open .chest-icon { left: 8px; top: 50%; width: 50px; height: 50px; transform: translateY(-50%); }
.btn-open span { font-size: 16px; white-space: nowrap; }
.btn-open b { font-size: 20px; padding: 4px 9px; border-radius: 8px; background: #2a180618; }
.btn-open:not(:disabled):active { box-shadow: inset 0 2px 0 #fff8d6, inset 0 -2px 0 #a8641a, 0 1px 0 #5a320c; }
.btn-open:disabled { filter: saturate(.55) brightness(.75); animation: none; }
.btn-open:disabled::after { animation: none; }
.btn.btn-open[aria-busy="true"] { background-image: repeating-linear-gradient(-45deg, #ffffff40 0 10px, transparent 10px 20px), linear-gradient(#ffeaa6, #ffc650 55%, #e08c25); background-size: 28px 28px, auto; animation: working .6s linear infinite; filter: none; }

.weapon-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px; min-height: 52px; }
.weapon-name { min-width: 0; }
.weapon-name .kicker { display: block; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #d9cdb6; }
.weapon-name h2 { margin: 2px 0 0; font: 700 23px/1.1 var(--display); color: var(--accent, #e8f4ff); text-shadow: 0 2px 0 #000, 0 0 16px color-mix(in srgb, var(--accent, #fff) 45%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pips { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
.pips-row { display: flex; gap: 5px; }
.pip { width: 11px; height: 11px; transform: rotate(45deg); border-radius: 2px; border: 1px solid #e9c37a66; background: #120c08; }
.pip.on { background: var(--accent); border-color: #fff; box-shadow: 0 0 9px var(--accent); }
.pip.new { animation: pip-pop .6s cubic-bezier(.2,1.6,.4,1) both; }
.pips-label { font: 900 13px/1 var(--num); color: var(--accent, #e8f4ff); letter-spacing: .04em; }
.actions { display: grid; grid-template-columns: 2fr 3fr; gap: 8px; }
.btn-sell { color: #ffe7ad; background: linear-gradient(#5a3c20, #34220f); border-color: #160d05; box-shadow: inset 0 1px 0 #ffd36b55, inset 0 0 0 1px #ffd36b44, 0 5px 0 #120a04; min-height: 80px; }
.lbl-icon { display: inline-block; vertical-align: -4px; margin-right: 6px; filter: drop-shadow(0 1px 2px #0009); }
.coin-btn-icon { width: 20px; height: 20px; }
.hammer-icon { width: 34px; height: auto; margin-right: 4px; transform: rotate(-38deg); vertical-align: -2px; }
.btn-sell:not(:disabled):active { box-shadow: inset 0 1px 0 #ffd36b55, inset 0 0 0 1px #ffd36b44, 0 1px 0 #120a04; }
.btn-upgrade { color: #fff; background: linear-gradient(#4fe39a, #1ea85b 50%, #0d6b44); box-shadow: inset 0 2px 0 #c8ffe0aa, inset 0 -3px 0 #0a5a2e, 0 5px 0 #05331b, 0 0 22px #36d07b44; min-height: 80px; text-shadow: 0 2px 0 #0a4a24; }
.btn-upgrade b { font-size: 32px; }
.btn-upgrade:not(:disabled):active { box-shadow: inset 0 2px 0 #c8ffe0aa, inset 0 -2px 0 #0a5a2e, 0 1px 0 #05331b; }
.btn[aria-busy="true"] { background-image: repeating-linear-gradient(-45deg, #ffffff22 0 10px, transparent 10px 20px), linear-gradient(#4fe39a, #1ea85b 50%, #0d6b44); background-size: 28px 28px, auto; animation: working .6s linear infinite; }
.btn-sell[aria-busy="true"] { background-image: repeating-linear-gradient(-45deg, #ffd36b22 0 10px, transparent 10px 20px), linear-gradient(#5a3c20, #34220f); }
.btn:disabled:not([aria-busy="true"]) { filter: saturate(.4) brightness(.7); }
.btn-upgrade.limit { filter: saturate(.3) brightness(.7); }

.result { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.result .kicker { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #d9cdb6; }
.result-sum { font: 900 46px/1.05 var(--num); white-space: nowrap; max-width: 100%; overflow: hidden; }
.stage[data-phase="won"] .result-sum { color: var(--gold); text-shadow: 0 3px 0 #4a2a08, 0 0 22px #ffb43a66; }
.stage[data-phase="lost"] .result-sum { color: #d8d3cc; text-shadow: 0 3px 0 #000; }
.result p { margin: 0; color: var(--muted); font-size: 13.5px; font-weight: 600; }
.btn-again { flex-direction: row; gap: 10px; min-height: 60px; color: var(--text); background: linear-gradient(#4a3220, #2e1f14); border-color: #160d05; box-shadow: inset 0 1px 0 #ffe7ad33, inset 0 0 0 1px #e9c37a44, 0 5px 0 #0b0704; }
.stage[data-phase="won"] .btn-again { background: linear-gradient(#4fe39a, #1ea85b 50%, #0d6b44); box-shadow: inset 0 2px 0 #c8ffe0aa, 0 5px 0 #05331b; text-shadow: 0 2px 0 #0a4a24; }
.btn-again span { font-size: 16px; }
.stage[data-phase="lost"] .btn-again[aria-busy="true"] { background-image: repeating-linear-gradient(-45deg, #ffffff1c 0 10px, transparent 10px 20px), linear-gradient(#4a3220, #2e1f14); }
.btn-again svg { width: 20px; height: 20px; }

.hud.shake-s { animation: shake-s .2s linear; }
.hud.shake-m { animation: shake-m .32s linear; }
.hud.shake-l { animation: shake-l .5s linear; }

.demo-note { max-width: 430px; margin: 8px auto 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12.5px; }
.demo-note button { min-height: 44px; padding: 0 6px; border: 0; background: none; color: #eadfcb; text-decoration: underline; text-underline-offset: 3px; transition: color .15s, transform .1s; }
.demo-note button:hover:not(:disabled) { color: var(--gold); }
.demo-note button:active:not(:disabled) { transform: scale(.96); }
.demo-note button:disabled { opacity: .45; cursor: default; }

/* ---------- Пять состояний ---------- */
.states-scroll { overflow-x: auto; padding-bottom: 10px; }
.state-strip { display: grid; grid-template-columns: repeat(5, 340px); gap: 18px; width: max-content; margin: 0 auto; }
.state-card h2 { margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; font: 700 16px/1.2 var(--display); }
.state-card h2 i { font: 900 13px/1 var(--num); font-style: normal; color: var(--gold); }
.state-card h2 small { color: var(--muted); font: 600 12.5px/1 var(--ui); }
.state-card .stage { height: 720px; }
.state-card .btn::after, .state-card .btn-open, .state-card .coin-icon img { animation: none; }

/* ---------- Звук ---------- */
.sound-btn { margin-left: auto; flex: none; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 1px solid #e9c37a77; background: linear-gradient(#2b1d12f2, #1a110bf2); color: #fff3d6; box-shadow: inset 0 1px 0 #ffe7ad33, 0 4px 14px #0009; transition: transform .12s, color .15s, border-color .15s; }
.sound-btn svg { width: 22px; height: 22px; }
.sound-btn:hover { border-color: var(--gold); color: var(--gold); }
.sound-btn:active { transform: scale(.92); }
.sound-btn[aria-expanded="true"] { background: #3a2610; border-color: var(--gold); color: var(--gold); }
.sound-btn.muted { color: var(--muted); border-color: #ffffff2a; }
.mixer { position: absolute; z-index: 20; top: 64px; right: 12px; width: min(300px, calc(100% - 24px)); padding: 12px 14px 8px; border-radius: 16px; background: linear-gradient(#2b1d12fa, #1a110bfa); border: 1px solid #e9c37a88; box-shadow: 0 18px 50px #000d, inset 0 1px 0 #ffe7ad22; }
.mixer::before { content: ""; position: absolute; top: -7px; right: calc(var(--arrow-right, 112px)); width: 12px; height: 12px; background: #2b1d12; border-left: 1px solid #e9c37a88; border-top: 1px solid #e9c37a88; transform: rotate(45deg); }
.mixer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.mixer-head b { font: 700 18px/1 var(--display); color: var(--gold); }
.mixer-power { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 6px; border-radius: 999px; border: 1px solid #4fe39a77; background: #0f2a1b; color: #d9ffe9; font-weight: 800; font-size: 13px; transition: transform .12s, background-color .15s; }
.mixer-power i { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--green); box-shadow: inset 0 1px 2px #0006; }
.mixer-power i::after { content: ""; position: absolute; top: 2px; left: 16px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0008; transition: left .15s; }
.mixer-power[aria-pressed="false"] { border-color: #ffffff26; background: #241a12; color: var(--muted); }
.mixer-power[aria-pressed="false"] i { background: #4a3a2c; }
.mixer-power[aria-pressed="false"] i::after { left: 2px; }
.mixer-row { display: grid; grid-template-columns: 1fr 44px; grid-template-areas: "label out" "range range"; align-items: center; column-gap: 8px; padding: 8px 0 4px; border-top: 1px solid #ffffff12; }
.mixer-label { grid-area: label; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.mixer-label b { font-weight: 800; font-size: 14px; }
.mixer-label small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mixer-row output { grid-area: out; text-align: right; font: 900 14px/1 var(--num); color: #fff3d6; }
.mixer-row input { grid-area: range; width: 100%; height: 32px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.mixer-row input::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--gold-deep), var(--gold) var(--fill, 50%), #3a2c20 var(--fill, 50%)); box-shadow: inset 0 1px 2px #0008; }
.mixer-row input::-moz-range-track { height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--gold-deep), var(--gold) var(--fill, 50%), #3a2c20 var(--fill, 50%)); }
.mixer-row input::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -7px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff8d6, #ffd36b 55%, #b8701c); border: 2px solid #2a1806; box-shadow: 0 2px 6px #000a; }
.mixer-row input::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #ffd36b; border: 2px solid #2a1806; }
.off .mixer-row { opacity: .45; }

<div class="page">
  <header class="page-head">
    <div class="page-title"><h1>Кузница</h1><p>Изумрудная кузня</p></div>
    <nav class="views" aria-label="Вид прототипа">
      <a href="#play" data-view="play">Играть</a>
      <a href="#states" data-view="states">5 состояний</a>
    </nav>
  </header>
  <main>
    <section id="play-view" class="play-view" aria-label="Игра">
      <div id="game-root"></div>
      <div class="demo-note"><span>Демо · условный баланс</span><button id="reset-demo" type="button">Сбросить демо</button></div>
    </section>
    <section id="states-view" class="states-view" aria-label="Пять состояний рядом" hidden>
      <div class="states-scroll"><div id="states-root" class="state-strip"></div></div>
    </section>
  </main>
  <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <noscript>Чтобы играть, включи JavaScript.</noscript>
</div>
<script type="module">
// ---- game.mjs ----
// Демонстрационная логика прототипа; денежные значения хранятся в копейках.
const STAKES = Object.freeze([2000, 5000, 10000, 20000, 50000, 100000]);
const PROFILES = Object.freeze({
  easy: Object.freeze({ label: 'Лёгкая', chance: 0.75, factor: 4 / 3 }),
  medium: Object.freeze({ label: 'Средняя', chance: 0.5, factor: 2 }),
  hard: Object.freeze({ label: 'Сложная', chance: 0.25, factor: 4 }),
});
const MAX_MULTIPLIER = 614400;

function randomUnit() {
  const sample = new Uint32Array(1);
  globalThis.crypto.getRandomValues(sample);
  return sample[0] / 4294967296;
}

class ForgeGame {
  #pending = null;
  #random;

  constructor({ random = randomUnit } = {}) {
    this.#random = random;
    this.reset();
  }

  reset() {
    this.#pending = null;
    this.phase = 'setup';
    this.balance = 125000;
    this.stake = 10000;
    this.difficulty = 'medium';
    this.multiplier = 0;
    this.level = 0;
    this.paid = 0;
  }

  get active() { return this.phase === 'opened' || this.phase === 'sharpened'; }
  get nextMultiplier() { return Math.round(this.multiplier * PROFILES[this.difficulty].factor); }
  get cashValue() { return Math.round(this.stake * this.multiplier / 100); }

  snapshot() {
    return {
      phase: this.phase, balance: this.balance, stake: this.stake,
      difficulty: this.difficulty, multiplier: this.multiplier,
      level: this.level, paid: this.paid,
      nextMultiplier: this.nextMultiplier,
      cashValue: this.cashValue,
      chance: PROFILES[this.difficulty].chance,
      busy: Boolean(this.#pending), operation: this.#pending?.kind || null,
      canOpen: this.phase === 'setup' && !this.#pending && this.balance >= this.stake,
      canUpgrade: this.active && !this.#pending && this.nextMultiplier <= MAX_MULTIPLIER,
    };
  }

  changeStake(direction) {
    if (this.phase !== 'setup' || this.#pending) return false;
    const index = STAKES.indexOf(this.stake);
    const next = Math.max(0, Math.min(STAKES.length - 1, index + Math.sign(direction)));
    this.stake = STAKES[next];
    return next !== index;
  }

  setDifficulty(value) {
    if (this.phase !== 'setup' || this.#pending || !Object.hasOwn(PROFILES, value)) return false;
    this.difficulty = value;
    return true;
  }

  beginOpen() {
    if (!this.snapshot().canOpen) return false;
    this.balance -= this.stake;
    this.#pending = { kind: 'open' };
    this.paid = 0;
    return true;
  }

  resolveOpen() {
    if (this.#pending?.kind !== 'open') return false;
    this.#pending = null;
    this.phase = 'opened';
    this.multiplier = 150;
    this.level = 0;
    return true;
  }

  beginUpgrade() {
    if (!this.snapshot().canUpgrade) return false;
    // Результат фиксируется один раз до анимации; повторные нажатия заблокированы.
    const sample = this.#random();
    if (!Number.isFinite(sample) || sample < 0 || sample >= 1) throw new RangeError('Некорректное случайное число');
    this.#pending = { kind: 'upgrade', success: sample < PROFILES[this.difficulty].chance, next: this.nextMultiplier };
    return true;
  }

  resolveUpgrade() {
    if (this.#pending?.kind !== 'upgrade') return false;
    const { success, next } = this.#pending;
    this.#pending = null;
    if (success) {
      this.phase = 'sharpened';
      this.multiplier = next;
      this.level += 1;
    } else {
      this.phase = 'lost';
      this.multiplier = 0;
      this.paid = 0;
    }
    return true;
  }

  sell() {
    if (!this.active || this.#pending) return false;
    this.paid = this.cashValue;
    this.balance += this.paid;
    this.phase = 'won';
    return true;
  }

  again() {
    if ((this.phase !== 'won' && this.phase !== 'lost') || this.#pending) return false;
    this.phase = 'setup';
    this.multiplier = 0;
    this.level = 0;
    this.paid = 0;
    if (this.stake > this.balance && this.balance >= STAKES[0]) {
      this.stake = STAKES.findLast(value => value <= this.balance);
    }
    return true;
  }
}

// «Изумрудная кузня»: сцена на canvas из живописных артов Nano Banana.
// Мир — координаты фонового арта (768×1376). Камера, свет, частицы и режиссура событий.
// Исход определяется в game.mjs; сцена только показывает его. Визуальная случайность — своя.

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const EASE = {
  linear: t => t,
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) ** 2,
  inOutQuad: t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2,
  inCubic: t => t ** 3,
  outCubic: t => 1 - (1 - t) ** 3,
  inOutCubic: t => t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2,
  outBack: t => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2,
  outElastic: t => t === 0 || t === 1 ? t : 2 ** (-10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1,
};
const COLORS = { gold: '#ffd36b', goldDeep: '#f0a830', green: '#58f2a6', red: '#ff5a48', ember: '#ff9a3c', steel: '#e4f1ff', white: '#ffffff' };

/* ---------- клинки по уровням ---------- */
const TIERS = [
  { name: 'Стальной клинок', accent: '#dcecff', glow: '#bcd8ff' },
  { name: 'Изумрудный клинок', accent: '#5cffb1', glow: '#2ff59a' },
  { name: 'Ледяной клинок', accent: '#8be9ff', glow: '#5fd2ff' },
  { name: 'Рунный клинок', accent: '#cd95ff', glow: '#b06aff' },
  { name: 'Солнечный клинок', accent: '#ffd24f', glow: '#ff9a2d' },
  { name: 'Лунный клинок', accent: '#a3f8ff', glow: '#9fe8ff' },
];
const ROMAN = ['', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
const PRESTIGE = ['#ffd36b', '#ff7ad9', '#ff5a48', '#ffffff'];
function weaponTier(level = 0) {
  const n = Math.max(0, Math.floor(Number(level) || 0));
  const tier = n ? 1 + (n - 1) % 5 : 0;
  const prestige = n ? Math.floor((n - 1) / 5) : 0;
  const t = TIERS[tier];
  const name = prestige ? `${t.name} ${ROMAN[Math.min(prestige, ROMAN.length - 1)]}` : t.name;
  return { level: n, tier, prestige, name, accent: t.accent, glow: t.glow, crown: prestige ? PRESTIGE[(prestige - 1) % PRESTIGE.length] : null };
}

/* ---------- арты ---------- */
const IMG = {};
let loaded = 0;
const total = Object.keys(ART).length;
const waiters = [];
for (const [key, src] of Object.entries(ART)) {
  const img = new Image();
  img.decoding = 'async';
  img.onload = img.onerror = () => { loaded++; if (loaded === total) waiters.splice(0).forEach(f => f()); };
  img.src = src;
  IMG[key] = img;
}
const artReady = new Promise(resolve => (loaded === total ? resolve() : waiters.push(resolve)));
const artURL = key => ART[key];

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return [c, c.getContext('2d')]; }
const cache = new Map();
function cached(key, make) { if (!cache.has(key)) cache.set(key, make()); return cache.get(key); }

function cachedFor(src, key, make) {

      default: this.star(x, y, 26 + this.rand() * 18, .7); break;
    }
    if (info.prestige && this.rand() < .45) this.spawn({ kind: 'ember', orbit: { a: this.rand() * TAU, w: -1.7, rx: 95, ry: 200 }, life: 1.8, size: 10, color: info.crown });
  }

  /* ---------- отрисовка ---------- */
  draw() {
    const g = this.g, c = this.canvas;
    if (!c.width || !this.baseS) return;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#120d0a'; g.fillRect(0, 0, c.width, c.height);
    if (!this.bgCold) return;
    const t = this.time, tr = this.cam.trauma ** 2;
    const U = this.baseS * this.cam.zoom * this.dpr;
    const ox = tr * 26 * Math.sin(t * 61.3 + 1.7) * Math.cos(t * 23.1), oy = tr * 22 * Math.sin(t * 53.7 + 4.1) * Math.cos(t * 19.3 + 2);
    g.setTransform(U, 0, 0, U, c.width / 2 - (this.cam.x + ox) * U, this.focusY * this.dpr - (this.cam.y + oy) * U);
    this.drawWorld(g, t);
    // Экранные слои: вспышка, напряжение, виньетка.
    g.setTransform(1, 0, 0, 1, 0, 0);
    if (this.env.tension > 0) {
      const vg = g.createRadialGradient(c.width / 2, c.height * .45, c.width * .2, c.width / 2, c.height * .45, c.height * .7);
      vg.addColorStop(0, '#00000000'); vg.addColorStop(1, hexA('#05080a', .75 * this.env.tension));
      g.fillStyle = vg; g.fillRect(0, 0, c.width, c.height);
    }
    const vg = g.createRadialGradient(c.width / 2, c.height * .42, Math.min(c.width, c.height) * .35, c.width / 2, c.height * .42, Math.max(c.width, c.height) * .78);
    vg.addColorStop(0, '#00000000'); vg.addColorStop(1, hexA('#060403', .55 + this.env.cold * .2));
    g.fillStyle = vg; g.fillRect(0, 0, c.width, c.height);
    if (this.env.red > 0) { g.fillStyle = hexA('#ff2a1a', this.env.red * .28); g.fillRect(0, 0, c.width, c.height); }
    if (this.env.flash > 0) { g.globalCompositeOperation = 'lighter'; g.fillStyle = hexA(this.env.flashColor, this.env.flash * .55); g.fillRect(0, 0, c.width, c.height); g.globalCompositeOperation = 'source-over'; }
    this.drawFx();
  }

  drawWorld(g, t) {
    const bg = IMG.bg;
    // Фон и его края: сверху балки, снизу пол уходят в тень.
    g.fillStyle = '#1a120c'; g.fillRect(-600, -800, bg.width + 1200, 800);
    g.fillStyle = '#1d140e'; g.fillRect(-600, bg.height, bg.width + 1200, 900);
    g.drawImage(bg, 0, 0);
    if (this.env.cold > 0) { g.globalAlpha = clamp(this.env.cold, 0, 1); g.drawImage(this.bgCold, 0, 0); g.globalAlpha = 1; }
    // Сундук — часть картины: рисуется сразу после фона, до света сцены, чтобы его освещали те же источники.
    this.drawChest(g, t);
    for (const [x, w, dir] of [[-600, 600, 1], [bg.width, 600, -1]]) {
      const gr = g.createLinearGradient(dir > 0 ? 0 : bg.width, 0, dir > 0 ? -120 : bg.width + 120, 0);
      gr.addColorStop(0, '#120d0a00'); gr.addColorStop(1, '#120d0a');
      g.fillStyle = gr; g.fillRect(x, -800, w, bg.height + 1700);
    }
    // Живой свет: горн, грибы, фонари, луна в окне.
    const fire = clamp(this.env.forge + this.env.forgeBoost, 0, 1.6);
    const flick = this.reduced ? 1 : .9 + Math.sin(t * 9) * .05 + Math.sin(t * 23.7) * .04 + Math.sin(t * 3.1) * .03;
    g.globalCompositeOperation = 'lighter';
    this.glowAt(g, FORGE.x, FORGE.y, 120 + 120 * fire * flick, '#ff7a26', .5 * fire * flick);
    this.glowAt(g, FORGE.x + 140, FORGE.y + 90, 260 * fire, '#ff9a3c', .16 * fire * flick);
    const pulse = this.reduced ? 1 : .8 + Math.sin(t * 1.3) * .2;
    for (const [x, y, r] of [[528, 742, 90], [722, 838, 70], [608, 392, 70]]) this.glowAt(g, x, y, r, '#3fffd0', .22 * pulse * (1 - this.env.cold * .6));
    for (const [x, y] of [[72, 318], [166, 284], [676, 250]]) this.glowAt(g, x, y, 70, '#ffb35a', .25 * (this.reduced ? 1 : .9 + Math.sin(t * 7 + x) * .1) * (1 - this.env.cold * .5));
    this.glowAt(g, 380, 445, 220, '#7fe8ff', .1 + this.env.cold * .06);
    // Пятно света на постаменте.
    this.glowAt(g, PED.x, PED.y - 120, 300, '#ffe2a8', .18 * this.env.spot * (1 - this.env.cold * .6));
    g.globalCompositeOperation = 'source-over';
    this.drawChestLight(g);
    // Тень-подложка за клинком отделяет его от окна; ложится и на крышку — общий полумрак, а не вырез вокруг сундука.
    if (this.sword.visible) {
      const sy = this.sword.y + this.bobY() + this.sword.lift - 40;
      const gr = g.createRadialGradient(PED.x, sy, 20, PED.x, sy, 260);
      gr.addColorStop(0, '#0a0d1088'); gr.addColorStop(.6, '#0a0d1033'); gr.addColorStop(1, '#0a0d1000');
      g.fillStyle = gr; g.beginPath(); g.ellipse(PED.x, sy, 220, 260, 0, 0, TAU); g.fill();
    }
    this.drawParts(g, 'back');
    this.drawRays(g, t);
    this.drawStack(g);
    this.drawFragments(g, 'floor');
    this.drawSword(g, t);
    this.drawHammer(g);
    this.drawFragments(g, 'air');
    this.drawParts(g, 'front');
  }

  glowAt(g, x, y, r, color, a) {
    if (a <= 0 || r <= 0) return;
    g.globalAlpha = clamp(a, 0, 1);
    g.drawImage(soft(color), x - r, y - r, r * 2, r * 2);
    g.globalAlpha = 1;
  }

  drawRays(g, t) {
    const a = this.env.rays;
    if (a <= 0) return;
    const cx = this.raysAt?.x ?? PED.x, cy = this.raysAt?.y ?? (this.sword.y + this.bobY());
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.translate(cx, cy);
    g.rotate(this.reduced ? 0 : t * .25);
    const n = 14;
    for (let i = 0; i < n; i++) {
      g.rotate(TAU / n);
      const gr = g.createLinearGradient(0, 0, 0, -620);
      gr.addColorStop(0, hexA(this.env.raysColor, .42 * a)); gr.addColorStop(1, hexA(this.env.raysColor, 0));
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(-34 - (i % 2) * 20, -620); g.lineTo(34 + (i % 2) * 20, -620); g.closePath(); g.fill();
    }
    g.restore();
    this.glowAt(g, cx, cy, 260, this.env.raysColor, .4 * a);
  }

  drawStack(g) {
    // Монеты лежат на полу в камере сцены: арт монеты снят сверху-сбоку и дожат по вертикали до наклона пола.
    const img = IMG['coin-flat'];
    const w = 46, h = w * img.height / img.width * .72;
    const base = STACKS.map((s, k) => ({ s, k })).sort((a, b) => a.s.y - b.s.y);
    for (const { s, k } of base) {
      const coins = this.stack.filter(c => Math.floor(c.i / 4) % STACKS.length === k && !(c.delay > 0)).sort((a, b) => a.i - b.i);
      if (!coins.length) continue;
      g.fillStyle = '#0000006e'; g.beginPath(); g.ellipse(s.x + 3, s.y + h * .3, w * .62, w * .62 * FLOOR_K, 0, 0, TAU); g.fill();
      for (const c of coins) {
        const p = this.stackSlot(c.i);
        g.drawImage(img, p.x - w / 2, p.y - Math.max(0, c.drop) - h / 2, w, h);
      }
    }
  }

  chestKey() {
    const lid = this.chest.lid;
    if (lid >= .75) return 'chest-open';
    if (lid >= .25 || this.env.leak > .35) return 'chest-ajar';
    return 'chest-closed';
  }
  drawChest(g, t) {
    // Слой сундука лежит в координатах фона: без движения он совпадает с картиной пиксель в пиксель.
    // Дрожь и пружина считаются от точки опоры на постаменте, поэтому низ корпуса не отрывается от камня.
    if (!this.chestCold) return;
    const ch = this.chest;
    const key = this.chestKey();
    const img = IMG[key], m = META[key];
    const shake = ch.shake && !this.reduced ? Math.sin(t * 70) * ch.shake * 2.2 : 0;
    const tilt = ch.shake && !this.reduced ? Math.sin(t * 47) * ch.shake * .006 : 0;
    g.save();
    g.translate(m.ax + shake, m.ay);
    g.rotate(tilt);
    g.scale(2 - ch.squash, ch.squash);
    g.drawImage(img, m.x - m.ax, m.y - m.ay);
    if (this.env.cold > 0) { g.globalAlpha = clamp(this.env.cold, 0, 1); g.drawImage(this.chestCold[key], m.x - m.ax, m.y - m.ay); g.globalAlpha = 1; }
    g.restore();
  }
  drawChestLight(g) {
    const ch = this.chest;
    g.globalCompositeOperation = 'lighter';
    if (this.env.leak > 0) {
      const a = this.env.leak;
      g.save(); g.translate(PED.x, SEAM_Y); g.scale(1, .16); this.glowAt(g, 0, 0, 150, '#ffd77a', .9 * a); g.restore();
      this.glowAt(g, PED.x, SEAM_Y, 150, '#ffcc66', .35 * a);
    }
    if (ch.glow > 0 && ch.lid >= .75 && this.env.cold < 1) this.glowAt(g, PED.x, LID_Y + 10, 140 + ch.glow * 60, '#ffc861', .4 * ch.glow * (1 - this.env.cold));
    // Клинок светится — его свет падает на пасть сундука и крышку под ним.
    const s = this.sword;
    if (s.visible && s.alpha > 0 && !this.hammer.visible) {
      const info = weaponTier(s.level);
      this.glowAt(g, s.x, LID_Y - 20, 150, info.glow, clamp(.16 * s.glow * s.alpha * (1 - this.env.cold * .7), 0, .4));
    }
    g.globalCompositeOperation = 'source-over';
  }

  swordTransform(g, extraY = 0, sx = this.sword.sx, rot = this.sword.rot) {
    const s = this.sword;
    const jx = s.jitter ? (this.rand() - .5) * 8 * s.jitter : 0;
    g.translate(s.x + jx, s.y + this.bobY() + s.lift + extraY);
    if (s.flat < 1) g.scale(1, s.flat);
    g.rotate(rot);
    g.scale(SWORD_S * s.scale * sx, SWORD_S * s.scale);
  }

  drawSword(g, t) {
    const s = this.sword;
    if (!s.visible || s.alpha <= 0) return;
    const info = weaponTier(s.level);
    const img = swordImg(s.level);
    g.save();
    if (s.clip) { g.beginPath(); g.rect(-1000, -1000, 3000, RIM_Y + 1000); g.clip(); }
    // Шлейф движения.
    if (s.trail > 0) {
      for (let i = this.trail.length - 1; i >= 1; i--) {
        const p = this.trail[i];
        g.save(); g.globalAlpha = s.trail * .16 * (1 - i / this.trail.length) * s.alpha; g.globalCompositeOperation = 'lighter';
        g.translate(p.x, p.y); if (s.flat < 1) g.scale(1, s.flat); g.rotate(p.rot); g.scale(SWORD_S * s.scale * p.sx, SWORD_S * s.scale);
        g.drawImage(silhouette(img, info.accent), -SWORD.cx, -SWORD.cy);
        g.restore();
      }
    }
    // Аура уровня и престижа.
    g.save();
    this.swordTransform(g);
    g.globalCompositeOperation = 'lighter';
    const auraA = clamp((.32 + info.tier * .07 + info.prestige * .12) * s.glow, 0, 1) * s.alpha;
    const au = aura(img, info.glow);
    g.globalAlpha = auraA * (this.reduced ? 1 : .85 + Math.sin(t * 2.4) * .15);
    g.drawImage(au, -SWORD.cx - au.pad, -SWORD.cy - au.pad);
    if (info.crown) { const cr = aura(img, info.crown, 44); g.globalAlpha = .45 * s.alpha; g.drawImage(cr, -SWORD.cx - cr.pad, -SWORD.cy - cr.pad); }
    g.restore();
    // Сам клинок, с перековкой снизу вверх.
    g.save();
    this.swordTransform(g);
    g.globalAlpha = s.alpha;
    if (s.from != null && s.reforge < 1) {
      const fromImg = swordImg(s.from);
      const cut = SWORD.h * (1 - s.reforge);
      g.save(); g.beginPath(); g.rect(-SWORD.cx, -SWORD.cy, SWORD.w, cut); g.clip(); g.drawImage(fromImg, -SWORD.cx, -SWORD.cy); g.restore();
      g.save(); g.beginPath(); g.rect(-SWORD.cx, -SWORD.cy + cut, SWORD.w, SWORD.h - cut); g.clip(); g.drawImage(img, -SWORD.cx, -SWORD.cy); g.restore();
      // Полоса перековки идёт только по металлу клинка, без прямоугольных краёв.
      const y = cut;
      const [bc, bg2] = makeCanvas(SWORD.w, SWORD.h);
      bg2.drawImage(img, 0, 0); bg2.globalCompositeOperation = 'source-atop';
      const gr = bg2.createLinearGradient(0, y - 70, 0, y + 70);
      gr.addColorStop(0, '#ffffff00'); gr.addColorStop(.5, hexA(info.accent, 1)); gr.addColorStop(1, '#ffffff00');
      bg2.fillStyle = gr; bg2.fillRect(0, y - 70, SWORD.w, 140);
      g.globalCompositeOperation = 'lighter';
      g.drawImage(bc, -SWORD.cx, -SWORD.cy);
      this.glowAt(g, 0, y - SWORD.cy, 130, info.accent, .55);
      g.globalCompositeOperation = 'source-over';
    } else g.drawImage(img, -SWORD.cx, -SWORD.cy);
    if (s.heat > 0) { g.globalAlpha = s.alpha * s.heat * .55; g.globalCompositeOperation = 'lighter'; g.drawImage(silhouette(img, '#ff7a2a'), -SWORD.cx, -SWORD.cy); g.globalCompositeOperation = 'source-over'; }
    if (s.tint > 0) { g.globalAlpha = s.alpha * s.tint; g.drawImage(silhouette(img, s.tintColor), -SWORD.cx, -SWORD.cy); }
    g.globalAlpha = 1;
    if (s.crack > 0 && this.cracks) this.drawCracks(g, img, s.crack);
    // Блик, бегущий по клинку.
    if (!this.reduced && s.shineAt != null) {
      const k = (t - s.shineAt) / .6;
      if (k >= 0 && k <= 1) {
        const [c2, g2] = makeCanvas(SWORD.w, SWORD.h);
        g2.drawImage(img, 0, 0); g2.globalCompositeOperation = 'source-atop';
        const y = lerp(SWORD.h, -100, k);
        const gr = g2.createLinearGradient(0, y - 90, 0, y + 90);
        gr.addColorStop(0, '#ffffff00'); gr.addColorStop(.5, '#ffffffcc'); gr.addColorStop(1, '#ffffff00');
        g2.fillStyle = gr; g2.fillRect(0, 0, SWORD.w, SWORD.h);
        g.globalCompositeOperation = 'lighter'; g.drawImage(c2, -SWORD.cx, -SWORD.cy); g.globalCompositeOperation = 'source-over';
      }
    }
    g.restore();
    g.restore();
  }

  drawCracks(g, img, k) {
    const [c, cg] = makeCanvas(SWORD.w, SWORD.h);
    cg.drawImage(img, 0, 0);
    cg.globalCompositeOperation = 'source-atop';
    cg.lineCap = 'round'; cg.lineJoin = 'round';
    for (const [color, width] of [['#2a0d08', 9], ['#ffd2a0', 4]]) {
      cg.strokeStyle = color; cg.lineWidth = width;
      for (const line of this.cracks) {
        const n = Math.max(2, Math.ceil(line.length * k));
        cg.beginPath(); cg.moveTo(line[0][0], line[0][1]);
        for (let i = 1; i < n; i++) cg.lineTo(line[i][0], line[i][1]);
        cg.stroke();
      }
    }
    g.drawImage(c, -SWORD.cx, -SWORD.cy);
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = .5 * k;
    g.drawImage(c, -SWORD.cx, -SWORD.cy);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  makeCracks() {
    const lines = [];
    for (const y0 of [380, 420, 300, 520]) {
      let x = SWORD.cx + (this.rand() - .5) * 20, y = y0;
      const line = [[x, y]];
      const dir = this.rand() < .5 ? -1 : 1;
      for (let i = 0; i < 9; i++) { y += (this.rand() - .5) * 70; x += dir * (8 + this.rand() * 14) * (i % 2 ? 1 : -.4); line.push([x, y]); }
      lines.push(line);
      const branch = [[SWORD.cx, y0]];
      let bx = SWORD.cx, by = y0;
      for (let i = 0; i < 6; i++) { by -= 30 + this.rand() * 40; bx += (this.rand() - .5) * 30; branch.push([bx, by]); }
      lines.push(branch);
    }
    this.cracks = lines;
  }

  hammerPose(angle = this.hammer.angle) {
    const geo = this.hammerGeo;
    const theta = CONTACT_THETA + angle * 1.6;
    const target = this.contactTarget();
    const c = this.contactLocal();
    const cos0 = Math.cos(CONTACT_THETA), sin0 = Math.sin(CONTACT_THETA);
    const pivot = { x: target.x - (c.x * cos0 - c.y * sin0), y: target.y - (c.x * sin0 + c.y * cos0) };
    return { pivot, theta, geo };
  }
  contactLocal() {
    const geo = this.hammerGeo;
    const sin0 = Math.sin(CONTACT_THETA), cos0 = Math.cos(CONTACT_THETA);
    // Выбираем грань бойка, которая смотрит вниз в момент удара.
    const a = { x: geo.headX, y: geo.headHalf }, b = { x: geo.headX, y: -geo.headHalf };
    const ya = a.x * sin0 + a.y * cos0, yb = b.x * sin0 + b.y * cos0;
    return ya > yb ? a : b;
  }
  contactTarget() { return { x: this.sword.x - 70, y: LAY_Y - 12 }; }
  hammerContactWorld() { return this.contactTarget(); }

  drawHammer(g) {
    const h = this.hammer;
    if (!h.visible || h.alpha <= 0 || !this.hammerGeo) return;
    const { pivot, theta, geo } = this.hammerPose();
    const img = IMG.hammer;
    const draw = (th, alpha) => {
      g.save();
      g.globalAlpha = alpha;
      g.translate(pivot.x + h.slide, pivot.y - h.slide * .4);
      g.rotate(th);
      g.scale(HAMMER_S, HAMMER_S);
      g.drawImage(img, -geo.gx, -geo.gy);
      if (h.hot > 0) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = alpha * h.hot * .6; g.drawImage(silhouette(img, '#ffb347'), -geo.gx, -geo.gy); }
      g.restore();
    };
    if (h.blur > 0 && !this.reduced) for (let i = 3; i >= 1; i--) draw(theta + i * .09 * h.blur, h.alpha * .14);
    draw(theta, h.alpha);
    // Руна на бойке светится сильнее на решающем ударе.
    if (this.env.tension > 0) {
      const head = { x: pivot.x + Math.cos(theta) * geo.headX, y: pivot.y + Math.sin(theta) * geo.headX };
      g.globalCompositeOperation = 'lighter';
      this.glowAt(g, head.x, head.y, 90, '#5cff9a', .5 * this.env.tension);
      g.globalCompositeOperation = 'source-over';
    }
  }

  drawFragments(g, layer) {
    for (const f of this.fragments) {
      if ((f.landed ? 'floor' : 'air') !== layer || f.alpha <= 0) continue;
      const rest = REST[f.index];
      if (f.landed) {
        // Тень в плоскости пола под точкой опоры (у лежащей части — вдоль всей длины).
        const rx = rest.flat ? f.len * .55 : 16, ry = rest.flat ? 9 : 5;
        g.fillStyle = `rgba(0,0,0,${.45 * f.alpha})`; g.beginPath(); g.ellipse(rest.foot.x, rest.foot.y, rx, ry, 0, 0, TAU); g.fill();
      }
      g.save();
      g.globalAlpha = f.alpha;
      if (f.landed && rest.stab) { g.beginPath(); g.rect(-2000, -2000, 5000, rest.stab + 2000); g.clip(); }
      g.translate(f.x, f.y);
      if (f.landed && rest.flat) g.scale(1, rest.flat);
      g.rotate(f.rot); g.scale(SWORD_S, SWORD_S);
      g.drawImage(f.img, -f.cx, -f.cy);
      if (f.hot > 0) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = f.alpha * f.hot * .7; g.drawImage(silhouette(f.img, '#ff7a3a'), -f.cx, -f.cy); }
      g.restore();
    }
  }

  drawParts(g, layer) {
    const star = IMG.flare;
    for (const p of this.parts) {
      if (p.layer !== layer) continue;
      const k = p.age / p.life, fade = 1 - k;
      switch (p.kind) {
        case 'spark': {
          g.globalCompositeOperation = 'lighter';
          g.strokeStyle = hexA(p.color, fade); g.lineWidth = p.size * (.6 + fade * .6); g.lineCap = 'round';
          g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); g.stroke();
          g.globalCompositeOperation = 'source-over';
          break;
        }
        case 'ember': case 'dot': {
          g.globalCompositeOperation = 'lighter';
          const a = p.firefly ? Math.sin(Math.PI * k) * (.6 + .4 * Math.sin(this.time * 6 + p.wobble)) : fade;
          g.globalAlpha = clamp(a, 0, 1);
          const r = p.size * 2.4;
          g.drawImage(dot(p.color), p.x - r, p.y - r, r * 2, r * 2);
          g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
          break;
        }
        case 'leaf': {
          g.save(); g.globalAlpha = fade; g.translate(p.x, p.y); g.rotate(p.rot);
          g.fillStyle = p.color; g.beginPath(); g.ellipse(0, 0, p.size, p.size * .45, 0, 0, TAU); g.fill();
          g.restore();
          g.globalCompositeOperation = 'lighter'; this.glowAt(g, p.x, p.y, p.size * 3, p.color, .35 * fade); g.globalCompositeOperation = 'source-over';
          break;
        }
        case 'glow': { g.globalCompositeOperation = 'lighter'; this.glowAt(g, p.x, p.y, p.r * (.6 + k * .8), p.color, fade * .9); g.globalCompositeOperation = 'source-over'; break; }

          g.globalCompositeOperation = 'source-over';
          break;
        }
        case 'star': {
          g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = Math.sin(Math.PI * k);
          g.translate(p.x, p.y); g.rotate(p.rot);
          const r = p.r * (.6 + .6 * Math.sin(Math.PI * k));
          g.drawImage(star, -r, -r, r * 2, r * 2);
          g.restore();
          break;
        }
        case 'coin': {
          const img = IMG.coin;
          const w = p.size * Math.max(.12, Math.abs(Math.cos(this.time * 9 + p.rot)));
          g.globalAlpha = p.noFade ? 1 : clamp(fade * 2, 0, 1);
          g.drawImage(img, p.x - w / 2, p.y - p.size / 2, w, p.size);
          g.globalAlpha = 1;
          break;
        }
        case 'shard': {
          g.save(); g.globalAlpha = clamp(fade * 1.5, 0, 1); g.translate(p.x, p.y); g.rotate(p.rot);
          g.fillStyle = p.color; g.beginPath(); g.moveTo(0, -p.size); g.lineTo(p.size * .6, p.size * .5); g.lineTo(-p.size * .5, p.size * .3); g.closePath(); g.fill();

        case 'smoke': {

          break;
        }
      }
    }
  }

  drawFx() {
    const g = this.fg;
    if (!g) return;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, this.fx.width, this.fx.height);
    if (!this.fxParts.length) return;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    const img = IMG.coin;
    for (const c of this.fxParts) {
      if (c.age < 0) continue;
      const k = EASE.inOutQuad(clamp(c.age / c.life, 0, 1));
      const x = (1 - k) ** 2 * c.p0.x + 2 * (1 - k) * k * c.p1.x + k * k * c.p2.x;
      const y = (1 - k) ** 2 * c.p0.y + 2 * (1 - k) * k * c.p1.y + k * k * c.p2.y;
      const size = lerp(30, 18, k);
      const w = size * Math.max(.15, Math.abs(Math.cos(c.age * 14 + c.seed)));
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = .5;
      g.drawImage(dot('#ffd36b'), x - size, y - size, size * 2, size * 2);
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = 1;
      g.drawImage(img, x - w / 2, y - size / 2, w, size);
    }
  }

  /* ---------- осколки ---------- */
  pieces(level) {
    const img = swordImg(level);
    return cachedFor(img, 'pieces', () => {
      const rnd = seeded(91);
      const edges = [0, ...CUTS, SWORD.h].map((y, i, arr) => {
        if (i === 0 || i === arr.length - 1) return null;
        const pts = [];
        for (let x = -10; x <= SWORD.w + 10; x += 25) pts.push([x, y + (rnd() - .5) * 46]);
        return pts;
      });
      const out = [];
      for (let i = 0; i <= CUTS.length; i++) {
        const [c, g] = makeCanvas(SWORD.w, SWORD.h);
        g.beginPath();
        const top = edges[i], bottom = edges[i + 1];
        if (top) { g.moveTo(top[0][0], top[0][1]); for (const p of top) g.lineTo(p[0], p[1]); } else { g.moveTo(-10, -10); g.lineTo(SWORD.w + 10, -10); }
        if (bottom) for (const p of [...bottom].reverse()) g.lineTo(p[0], p[1]); else { g.lineTo(SWORD.w + 10, SWORD.h + 10); g.lineTo(-10, SWORD.h + 10); }
        g.closePath(); g.clip();
        g.drawImage(img, 0, 0);
        const y0 = i === 0 ? 0 : CUTS[i - 1], y1 = i === CUTS.length ? SWORD.h : CUTS[i];
        out.push({ img: c, cx: SWORD.cx, cy: (y0 + y1) / 2, len: (y1 - y0) * SWORD_S });
      }
      return out;
    });
  }
  makeFragments(level, settled, origin = { x: PED.x, y: SWORD_Y, rot: 0 }) {
    const list = this.pieces(level);
    const scene = this;
    return list.map((p, i) => {
      const rest = REST[i];
      const ly = (p.cy - SWORD.cy) * SWORD_S;
      const start = { x: origin.x - Math.sin(origin.rot) * ly, y: origin.y + Math.cos(origin.rot) * ly };
      const f = { ...p, index: i, x: settled ? rest.x : start.x, y: settled ? rest.y : start.y, rot: settled ? rest.rot : origin.rot, alpha: 1, hot: settled ? 0 : 1, floor: rest.foot.y, landed: settled, len: p.len };
      if (!settled) {
        const T = .62 + i * .05;
        f.vx = (rest.x - start.x) / T;
        f.vy = (rest.y - start.y - .5 * 1500 * T * T) / T;
        f.spin = (rest.rot - origin.rot + (i % 2 ? 1 : -1) * TAU) / T;
        f.t = 0; f.T = T;
        f.update = dt => {
          if (f.landed) { f.hot = Math.max(0, f.hot - dt * 1.4); return; }
          f.t += dt;
          f.x += f.vx * dt; f.vy += 1500 * dt; f.y += f.vy * dt; f.rot += f.spin * dt;
          f.hot = Math.max(0, f.hot - dt * .8);
          if (f.t >= f.T) { f.x = rest.x; f.y = rest.y; f.rot = rest.rot; f.landed = true; scene.onFragmentLand(f, i); }
        };
      }
      return f;
    });
  }
  onFragmentLand(f, i) {
    this.shake(.12);
    const foot = REST[i].foot;
    // Острие входит в доски — летит щепа; остальные части звенят о камень и пол.
    if (REST[i].stab) this.burst(foot.x, foot.y, { count: 9, colors: ['#8a5a36', '#c08a5a', '#e0b080'], speed: [90, 240], angle: [-Math.PI * .9, -Math.PI * .1], kind: 'shard', g: 1400, life: [.3, .5], size: [3, 6], floor: foot.y + 6 });
    this.burst(foot.x, f.floor, { count: 10, colors: ['#ffd0a0', '#ffffff', '#ff8a5a'], speed: [120, 300], angle: [-Math.PI, 0], g: 1200, life: [.2, .4], size: [3, 5] });
    this.smoke(foot.x, f.floor, 4, '#6d6a66', f.len * .6);
    this.beat('land', { index: i });
  }

  /* ---------- режиссура событий ---------- */
  stake(stakeIndex, direction) {
    this.fillStack(stakeIndex, !this.reduced);
    if (this.reduced) return;
    if (direction > 0) { this.glowPuff(STACKS[0].x, STACKS[0].y - 30, COLORS.gold, 70, .35); this.glowPuff(STACKS[1].x, STACKS[1].y - 30, COLORS.gold, 70, .35); }
    this.chest.squash = .95; this.tween(this.chest, { squash: 1 }, 260, 'outElastic');
  }
  setDifficulty(difficulty) {
    this.difficulty = difficulty;
    const target = FIRE_BY_DIFFICULTY[difficulty];
    if (this.reduced) { this.env.forge = target; return; }
    this.env.forgeBoost = .5;
    this.tween(this.env, { forge: target }, 450, 'outCubic');

    const colors = difficulty === 'hard' ? ['#ffffff', '#ffd27a', '#ff6a2a'] : difficulty === 'easy' ? ['#ffd27a', '#ffb347'] : ['#ffb347', '#ff8a2a'];
    this.burst(FORGE.x, FORGE.y - 20, { count: difficulty === 'hard' ? 30 : difficulty === 'medium' ? 18 : 10, colors, speed: [120, 380], angle: [-Math.PI * .8, -Math.PI * .2], g: -40, life: [.5, 1.1], kind: 'ember', drag: .8, size: [4, 8], layer: 'back' });
    this.glowPuff(FORGE.x, FORGE.y, '#ff8a2a', 160 + target * 60, .5, 'back');
  }

  async open() {
    const alive = this.alive();
    if (this.reduced) { this.chest.lid = 1; this.chest.glow = .55; this.stack = []; this.beat('lid'); await this.wait(60); Object.assign(this.sword, { visible: true, level: 0 }); this.beat('reveal'); return; }
    // 1. Монеты ставки летят в сундук.
    const coins = [...this.stack].reverse();
    const mouth = { x: PED.x, y: SEAM_Y - 20 };
    coins.forEach((c, n) => {
      const s = this.stackSlot(c.i);
      this.wait(n * 45).then(() => {
        if (!alive()) return;
        this.stack = this.stack.filter(x => x !== c);
        const T = .34, vy = -900;
        this.spawn({ kind: 'coin', x: s.x, y: s.y - 6, vx: (mouth.x - s.x) / T, vy, g: (2 * (mouth.y - s.y - vy * T)) / (T * T), life: T, size: 34, noFade: true, rot: n });
        this.wait(T * 1000).then(() => { if (!alive()) return; this.star(mouth.x + (this.rand() - .5) * 60, mouth.y, 36, .25); this.chest.squash = .97; this.tween(this.chest, { squash: 1 }, 160, 'outQuad'); });
      });
    });
    this.beat('stake-in', { coins: coins.length });
    await this.wait(coins.length * 45 + 340);
    if (!alive()) return;
    // 2. Сундук набирает силу.
    this.beat('charge');
    this.tween(this.cam, { zoom: 1.16, y: CAM0.y + 120 }, 650, 'inOutQuad');
    this.tween(this.chest, { shake: 1.6 }, 600, 'inQuad');
    this.tween(this.env, { leak: 1, spot: .6 }, 600, 'inQuad');
    for (let i = 0; i < 6; i++) this.wait(i * 100).then(() => alive() && this.burst(PED.x + (this.rand() - .5) * 200, SEAM_Y, { count: 4, colors: [COLORS.gold, '#fff3c0'], speed: [100, 260], angle: [-Math.PI * .8, -Math.PI * .2], life: [.2, .45], g: 600, size: [3, 5] }));
    await this.wait(620);
    if (!alive()) return;
    // 3. Крышка распахивается.
    this.chest.shake = 0; this.env.leak = 0;
    this.hitstop(70); this.flash('#ffe6a0', .75); this.shake(.5);
    this.beat('lid');
    this.chest.squash = .86; this.tween(this.chest, { squash: 1 }, 420, 'outElastic');
    this.chest.lid = 1;
    this.chest.glow = 1.5; this.tween(this.chest, { glow: .55 }, 1400, 'outQuad', 200);
    this.raysAt = { x: PED.x, y: LID_Y };
    this.env.raysColor = COLORS.gold; this.env.rays = 1.1;
    this.tween(this.env, { rays: 0 }, 1300, 'inQuad', 300);
    this.tween(this.cam, { zoom: 1, y: CAM0.y }, 900, 'outCubic', 80);
    this.tween(this.env, { spot: 1 }, 600);
    this.ring(PED.x, LID_Y, COLORS.gold, 20, 330, .5, 10);
    this.glowPuff(PED.x, LID_Y, COLORS.gold, 220, .5);
    this.star(PED.x, LID_Y - 10, 160, .45);
    this.burst(PED.x, LID_Y + 10, { count: 50, colors: [COLORS.gold, '#fff3c0', COLORS.goldDeep], speed: [300, 900], angle: [-Math.PI * .95, -Math.PI * .05], g: 1300, life: [.4, .9], size: [3, 7] });
    // Монеты вылетают из пасти и падают на поверхности картины: верх постамента или пол по бокам.
    for (let i = 0; i < 10; i++) {
      const vx = (i % 2 ? 1 : -1) * (120 + this.rand() * 420);
      const x = PED.x + (this.rand() - .5) * 80;
      this.spawn({ kind: 'coin', x, y: LID_Y + 10, vx, vy: -600 - this.rand() * 400, g: 1900, drag: 0, life: 1.1, surface: this.rand(), bounce: .4, size: 26, rot: i });
    }
    await this.wait(120);
    if (!alive()) return;
    // 4. Клинок поднимается из сундука с вращением.
    const s = this.sword;
    Object.assign(s, { visible: true, level: 0, y: SWORD_Y + 500, sx: 1, rot: 0, alpha: 1, tint: 1, tintColor: '#ffffff', clip: true, trail: 1, flat: 1, bob: 0, glow: 2.2, reforge: 1, from: null, crack: 0, heat: 0, lift: 0 });
    this.raysAt = null;
    this.beat('rise');
    const spin = { a: 0 };
    const spinTween = this.tween(spin, { a: TAU * 2 }, 760, 'outCubic');
    const tick = () => { s.sx = Math.cos(spin.a) || .05; if (spin.a < TAU * 2 - .01 && alive()) requestAnimationFrame(tick); else s.sx = 1; };
    tick();
    this.tween(s, { y: SWORD_Y - 36 }, 620, 'outCubic');
    this.tween(s, { tint: 0 }, 700, 'outQuad', 100);
    for (let i = 0; i < 8; i++) this.wait(i * 60).then(() => alive() && this.burst(PED.x, s.y, { count: 3, colors: ['#e8f6ff', COLORS.gold], speed: [40, 180], g: 150, life: [.3, .6], kind: 'dot', size: [4, 7] }));
    await this.wait(620);
    if (!alive()) return;
    s.clip = false;
    this.tween(s, { y: SWORD_Y }, 380, 'outBack');
    await spinTween;
    if (!alive()) return;
    s.sx = 1; s.trail = 0;
    this.tween(s, { glow: 1, bob: 1 }, 600);
    s.shineAt = this.time;
    this.ring(PED.x, SWORD_Y, COLORS.steel, 30, 260, .45, 6);
    this.star(PED.x, SWORD_Y - 200, 70, .5);
    this.star(PED.x - 30, SWORD_Y + 80, 40, .4);
    this.beat('reveal');
    await this.wait(320);
  }

  async upgradeWindup() {
    const alive = this.alive();
    const s = this.sword;
    if (this.reduced) { await this.wait(80); return; }
    this.beat('windup');
    Object.assign(this.hammer, { visible: true, angle: .9, alpha: 0, blur: 0, hot: 0, slide: 120 });
    this.tween(this.hammer, { alpha: 1, angle: .55, slide: 0 }, 300, 'outCubic');

    await this.tween(s, { lift: -24, bob: 0 }, 160, 'outQuad');

    this.wait(300).then(() => { if (!alive()) return; this.chest.squash = .97; this.tween(this.chest, { squash: 1 }, 200, 'outQuad'); this.burst(PED.x, LAY_Y + 6, { count: 10, colors: ['#ffe08a', '#ffffff'], speed: [80, 240], angle: [-Math.PI * .95, -Math.PI * .05], g: 900, life: [.2, .4], size: [2, 4] }); });
    this.wait(220).then(() => alive() && this.beat('lay'));
    await this.wait(320);

    for (let i = 0; i < 2; i++) {

  async upgradeResult(success, nextLevel) {
    const alive = this.alive();
    const s = this.sword;
    const prevLevel = s.level;

    if (this.reduced) {
      if (success) { s.level = nextLevel; s.rot = 0; this.beat('success'); }
      else { this.fragments = this.makeFragments(prevLevel, true); s.visible = false; this.env.cold = 1; this.env.forge = .3; this.chest.glow = .15; this.beat('shatter'); }

      this.spawn({ kind: 'pillar', x: PED.x, y: PED.y - 120, w: 110, life: 1.1, color: accent, layer: 'back' });
      this.tween(this.hammer, { angle: 1.6, alpha: 0, slide: 140 }, 360, 'outQuad').then(() => { this.hammer.visible = false; });

      for (let i = 0; i < 26; i++) this.spawn({ kind: 'ember', x: PED.x + (this.rand() - .5) * 120, y: SWORD_Y + 200 - this.rand() * 400, vx: (this.rand() - .5) * 50, vy: -150 - this.rand() * 200, life: .8 + this.rand() * .6, size: 5 + this.rand() * 6, color: this.rand() < .6 ? accent : '#ffffff', wobble: this.rand() * 6 });
      this.star(PED.x, SWORD_Y - 205, 90, .5);

    this.makeCracks();
    this.hitstop(170); this.shake(.35); this.flash('#ffb0a0', .35);

    this.burst(p.x, p.y, { count: 24, colors: ['#ffffff', '#ffb08a', '#ff6a3a'], speed: [250, 800], angle: [-Math.PI, 0], g: 1400, life: [.25, .55], size: [3, 6] });

// мастерская внутри живого дерева — тёплая деревянная комната вместо каменного зала; за круглым окном ночной лес;

// и стоит на камне; наковальни нет — волшебный молот бьёт по клинку, лежащему ребром на стенках сундука.

// ударом музыка уходит, остаётся сердцебиение; сила выигрышного звука пропорциональна выплате; поломка никогда

const clampA = (v, a, b) => Math.min(b, Math.max(a, v));

// Музыка: волшебный фолк, ре мажор, 72 удара в минуту, восьмые. Dmaj9 – Bm9 – Gmaj9 – A.
const BPM = 72;
const EIGHTH = 60 / BPM / 2;
const midi = n => 440 * 2 ** ((n - 69) / 12);
const CHORDS = [
  { root: 38, pad: [50, 57, 61, 66], arp: [50, 57, 64, 66, 69, 66, 64, 57] }, // Dmaj9
  { root: 35, pad: [47, 54, 57, 62], arp: [47, 54, 61, 62, 66, 62, 61, 54] }, // Bm9
  { root: 43, pad: [55, 59, 62, 66], arp: [55, 62, 66, 69, 71, 69, 66, 62] }, // Gmaj9
  { root: 45, pad: [52, 57, 61, 64], arp: [57, 64, 69, 71, 73, 71, 69, 64] }, // A

  [8, 74], [11, 78], [12, 81], [14, 83],
  [16, 78], [19, 79], [20, 83], [22, 81],
  [24, 76], [27, 74], [28, 73], [30, 69],

  { notes: [74, 78, 81, 85, 90], color: 'glass' }, // изумрудный: стеклянный перелив
  { notes: [79, 83, 86, 90, 95], color: 'ice' },   // ледяной: высокий хрусталь и иней
  { notes: [62, 69, 74, 76, 81], color: 'rune' },  // рунный: низкие квинты и гул
  { notes: [74, 78, 81, 86, 90], color: 'sun' },   // солнечный: тёплый медный аккорд
  { notes: [81, 85, 88, 93], color: 'moon' },      // лунный: мягкая челеста

function loadSettings() {
