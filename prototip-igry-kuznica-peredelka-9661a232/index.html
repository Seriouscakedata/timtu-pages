  whoosh({ t, dur = .4, from = 300, peak = 2200, gain = .22, dest = this.sfxBus }) {
    const ctx = this.ctx, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), a = ctx.createGain();
    s.buffer = this.noiseBuf; s.loop = true;
    f.type = 'bandpass'; f.Q.value = 1.4; a.gain.value = 0;
    f.frequency.value = from; f.frequency.setValueAtTime(from, t);
    f.frequency.exponentialRampToValueAtTime(peak, t + dur * .55);
    f.frequency.exponentialRampToValueAtTime(from * 1.2, t + dur);
    a.gain.setValueAtTime(0, t);
    a.gain.linearRampToValueAtTime(gain, t + dur * .55);
    a.gain.linearRampToValueAtTime(0, t + dur);
    s.connect(f).connect(a).connect(dest);
    s.start(t, rnd()); s.stop(t + dur + .05);
  }
  // Колокольчик-челеста: основной тон, октава и слабый негармонический блеск.
  bell({ t, note, gain = .06, decay = 1.4, dest = this.magicBus }) {
    const f = midi(note);
    this.tone({ t, freq: f, gain, attack: .002, decay, dest });
    this.tone({ t, freq: f * 2, gain: gain * .3, attack: .002, decay: decay * .5, dest });
    if (f * 4.07 < 15000) this.tone({ t, freq: f * 4.07, gain: gain * .12, attack: .001, decay: decay * .22, dest });
  }
  // Россыпь искр волшебства: случайные ноты пентатоники в высоком регистре.
  sparkle({ t, n = 6, spread = .5, gain = .035, lo = 0, dest = this.magicBus }) {
    for (let i = 0; i < n; i++) {
      const note = pent(12 + lo + Math.floor(rnd() * 6));
      this.tone({ t: t + rnd() * spread, freq: midi(note), gain: gain * (.6 + rnd() * .4), attack: .002, decay: .5, dest });
    }
  }
  // Арфа: быстрый перебор (щипки Карплуса — Стронга).
  harp({ t, notes, gap = .035, gain = .1, dest = this.magicBus, seconds = 1.6 }) {
    notes.forEach((n, i) => this.pluck({ t: t + i * gap, note: n, gain, seconds, damp: .997, cutoff: 5200, dest }));
  }
  // Волшебный гул: два расстроенных тона с дрожанием, высота растёт.
  swell({ t, dur = .6, from = 220, to = 660, gain = .05, dest = this.magicBus }) {
    const ctx = this.ctx, a = ctx.createGain(), trem = ctx.createOscillator(), tg = ctx.createGain();
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(gain, t + dur * .85); a.gain.linearRampToValueAtTime(0, t + dur + .08);
    trem.frequency.setValueAtTime(5, t); trem.frequency.linearRampToValueAtTime(11, t + dur); tg.gain.value = gain * .45;
    trem.connect(tg).connect(a.gain);
    for (const det of [-9, 9]) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.detune.value = det;
      o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(to, t + dur);
      o.connect(a); o.start(t); o.stop(t + dur + .12);
    }
    a.connect(dest); trem.start(t); trem.stop(t + dur + .12);
  }
  // Дрожь клинка, вошедшего в доски: затухающее «вжжж».
  quiver({ t, freq = 190, gain = .05, decay = .55, dest = this.sfxBus }) {
    const ctx = this.ctx, o = ctx.createOscillator(), a = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain(), out = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * .92, t + decay);
    lfo.frequency.setValueAtTime(24, t); lfo.frequency.linearRampToValueAtTime(14, t + decay); lg.gain.value = .5;
    a.gain.value = .5; lfo.connect(lg).connect(a.gain);
    this.env(out, t, gain, .003, decay);
    o.connect(a).connect(out).connect(dest);
    o.start(t); lfo.start(t); o.stop(t + decay * 1.6 + .05); lfo.stop(t + decay * 1.6 + .05);
  }
  // Щипок струны (Карплус — Стронг): буфер считается один раз на ноту и кэшируется.
  pluckBuffer(note, seconds = 1.6, damp = .996) {
    const key = `${note}|${seconds}|${damp}`;
    if (this.ksCache.has(key)) return this.ksCache.get(key);
    const ctx = this.ctx, sr = ctx.sampleRate, len = Math.floor(sr * seconds);
    const buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    const period = Math.max(2, Math.round(sr / midi(note)));
    const line = new Float32Array(period);
    for (let i = 0; i < period; i++) line[i] = rnd() * 2 - 1;
    let prev = 0, idx = 0;
    for (let i = 0; i < len; i++) {
      const cur = line[idx];
      const next = line[(idx + 1) % period];
      line[idx] = (cur + next) * .5 * damp;
      d[i] = cur * .6 + prev * .4; prev = cur;
      idx = (idx + 1) % period;
    }
    this.ksCache.set(key, buf);
    return buf;
  }
  pluck({ t, note, gain = .2, seconds = 1.6, damp = .996, dest = this.musicBus, cutoff = 3200 }) {
    const ctx = this.ctx, s = ctx.createBufferSource(), a = ctx.createGain(), f = ctx.createBiquadFilter();
    s.buffer = this.pluckBuffer(note, seconds, damp);
    f.type = 'lowpass'; f.frequency.value = cutoff;
    a.gain.setValueAtTime(gain, t);
    a.gain.setTargetAtTime(0, t + seconds * .6, seconds * .15);
    s.connect(f).connect(a).connect(dest);
    s.start(t); s.stop(t + seconds + .05);
  }

  /* ---------- окружение: горн, лес за окном, светлячки ---------- */
  startAmbient() {
    const ctx = this.ctx;
    // Горн: мягкое дыхание пламени — бурый шум через низкочастотный фильтр, медленно «дышит».
    const src = ctx.createBufferSource(); src.buffer = this.brownBuf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = .7;
    this.roar = ctx.createGain(); this.roar.gain.value = 0;
    const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
    lfo.frequency.value = .23; lfoGain.gain.value = .025;
    lfo.connect(lfoGain).connect(this.roar.gain);
    src.connect(lp).connect(this.roar).connect(this.ambBed);
    this.roarFilter = lp;
    src.start(); lfo.start();
    // Лес за круглым окном: шелест листвы порывами — полоса шума, громкость и окраска медленно плывут.
    const leaves = ctx.createBufferSource(); leaves.buffer = this.noiseBuf; leaves.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = .55;
    const soft = ctx.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 3200;
    const lg = ctx.createGain(); lg.gain.value = .014;
    const gust = ctx.createOscillator(), gustG = ctx.createGain(); gust.frequency.value = .07; gustG.gain.value = .01;
    const hue = ctx.createOscillator(), hueG = ctx.createGain(); hue.frequency.value = .045; hueG.gain.value = 450;
    gust.connect(gustG).connect(lg.gain); hue.connect(hueG).connect(bp.frequency);
    leaves.connect(bp).connect(soft).connect(lg).connect(this.ambBed);
    leaves.start(0, rnd()); gust.start(); hue.start();
    this.setFire(this.state.difficulty, this.state.phase === 'lost');
    // Случайные события окружения: треск углей, сверчки, светлячки, скрип дерева.
    const loop = (name, meanMs, fn) => {
      const tick = () => {
        if (!this.ctx) return;
        if (this.live && this.settings.amb > 0) { try { fn(this.ctx.currentTime + .02); } catch (e) { console.error(e); } }
        this.timers[name] = setTimeout(tick, -Math.log(1 - rnd()) * meanMs + meanMs * .15);
      };
      this.timers[name] = setTimeout(tick, meanMs * rnd());
    };
    loop('crackle', 260, t => {
      const level = this.fireLevel ?? 1;
      if (rnd() > (this.fireRate ?? 4) / 7) return; // плотность треска зависит от силы огня
      const big = rnd() < .1;
      this.noise({ t, dur: big ? .045 : .01 + rnd() * .018, gain: (big ? .14 : .05 + rnd() * .06) * level, type: 'highpass', freq: big ? 1300 : 2400 + rnd() * 2600, Q: .8, attack: .001, dest: this.ambBus });
    });
    loop('crickets', 1700, t => {
      const f = 4200 + rnd() * 500, n = 2 + Math.floor(rnd() * 3), gain = .005 + rnd() * .005;
      for (let i = 0; i < n; i++) this.tone({ t: t + i * .028, freq: f, gain, attack: .003, decay: .02, dest: this.ambBus });
    });
    loop('fireflies', 4200, t => {
      if (this.magicDim) return;
      const n = 1 + Math.floor(rnd() * 3), start = 10 + Math.floor(rnd() * 5);
      for (let i = 0; i < n; i++) this.bell({ t: t + i * (.12 + rnd() * .1), note: pent(start + i), gain: .012 + rnd() * .008, decay: 1.6, dest: this.ambBus });
    });
    loop('creak', 26000, t => {
      this.noise({ t, dur: .5, gain: .025, type: 'bandpass', freq: 290, to: 380, glide: .45, Q: 14, attack: .18, dest: this.ambBus, curve: 'lin' });
      this.noise({ t: t + .55, dur: .3, gain: .018, type: 'bandpass', freq: 360, to: 300, glide: .3, Q: 14, attack: .1, dest: this.ambBus, curve: 'lin' });
    });
  }
  setFire(difficulty, cold = false) {
    const level = cold ? .35 : { easy: .8, medium: 1, hard: 1.25 }[difficulty] ?? 1;
    this.fireLevel = level;
    this.fireRate = cold ? 1 : 2.2 + level * 3.2;
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.roar.gain.cancelScheduledValues(t);
    this.roar.gain.setTargetAtTime(.075 * level, t, .25);
    this.roarFilter.frequency.setTargetAtTime(cold ? 240 : 320 + level * 180, t, .3);
  }

  /* ---------- музыка ---------- */
  startMusic() {
    this.nextStepTime = this.ctx.currentTime + .15;
    this.timer = setInterval(() => this.schedule(), 50);
  }
  schedule() {
    if (!this.ctx || this.ctx.state !== 'running') return;
    while (this.nextStepTime < this.ctx.currentTime + .2) {
      this.playStep(this.step, this.nextStepTime);
      this.nextStepTime += EIGHTH;
      this.step = (this.step + 1) % 32;
    }
  }
  playStep(step, t) {
    if (t < this.musicHold) return;
    const k = this.intensity;
    const ci = Math.floor(step / 8), chord = CHORDS[ci];
    const i = step % 8;
    // Тёплые тянущиеся аккорды — всегда; на высоких заточках фильтр открывается.
    if (i === 0) this.pad(t, chord.pad, EIGHTH * 8, k);
    // Арфа: в спокойной фазе — через восьмую, в раунде — каждую; на пике — верхняя октава.
    if (k >= 1 || i % 2 === 0) this.pluck({ t, note: chord.arp[i] + (k >= 3 && i % 4 === 2 ? 12 : 0), gain: k >= 1 ? .12 : .15, cutoff: 3600 + k * 600, seconds: 2, damp: .9975 });
    // Мягкий бас на сильные доли.
    if (i === 0 || (k >= 2 && i === 4)) this.bass(t, chord.root, i === 0 ? .22 : .15);
    // Ручной барабан и шейкер — в раунде, с заточками ритм плотнее.
    if (k >= 1) {
      if (i === 0 || i === 4) this.drum(t, i === 0 ? .26 : .18);
      if (k >= 2 && (i === 3 || i === 7)) this.drum(t, .1, true);
      if (k >= 2 && i % 2 === 1) this.shaker(t, .02 + (k - 2) * .008);
    }
    // Челеста отвечает арфе на заточках.
    if (k >= 2 && (i === 2 || i === 6)) this.bell({ t, note: chord.pad[(i / 2 + ci) % 4] + 24, gain: .03, decay: 1.5, dest: this.musicBus });
    // Окарина ведёт мелодию на высоких заточках.
    if (k >= 3) for (const [s, n] of MELODY) if (s === step) this.flute(t, n, EIGHTH * 1.8);
  }
  pad(t, notes, dur, k) {
    const ctx = this.ctx, f = ctx.createBiquadFilter(), a = ctx.createGain();
    f.type = 'lowpass'; f.frequency.value = 620 + k * 170; f.Q.value = .6;
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(.045, t + .9);
    a.gain.setValueAtTime(.045, t + dur - .15); a.gain.linearRampToValueAtTime(0, t + dur + .9);
    f.connect(a).connect(this.padBus);
    for (const n of notes) for (const det of [-7, 7]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = midi(n); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + dur + 1);
    }
  }
  bass(t, note, gain) {
    this.tone({ t, freq: midi(note), type: 'sine', gain, attack: .012, decay: 1.4, dest: this.musicBus });
    this.tone({ t, freq: midi(note + 12), type: 'triangle', gain: gain * .25, attack: .01, decay: .6, dest: this.musicBus });
  }
  drum(t, gain, light = false) {
    this.tone({ t, freq: light ? 150 : 100, to: light ? 100 : 58, glide: .1, gain, attack: .003, decay: light ? .1 : .26, dest: this.musicBus });
    this.noise({ t, dur: light ? .03 : .06, gain: gain * .3, type: 'lowpass', freq: 700, Q: .7, attack: .001, dest: this.musicBus });
  }
  shaker(t, gain) { this.noise({ t, dur: .05, gain, type: 'highpass', freq: 6500, attack: .018, dest: this.musicBus }); }
  flute(t, note, dur) {
    const ctx = this.ctx, o = ctx.createOscillator(), a = ctx.createGain(), vib = ctx.createOscillator(), vg = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = 'sine'; o.frequency.value = midi(note);
    vib.frequency.value = 5; vg.gain.value = 3.5; vib.connect(vg).connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = 3000;
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(.08, t + .07); a.gain.setValueAtTime(.08, t + dur * .7); a.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(f).connect(a).connect(this.musicBus);
    this.noise({ t, dur: dur * .6, gain: .012, type: 'bandpass', freq: midi(note) * 2, Q: 3, attack: .05, dest: this.musicBus }); // дыхание
    o.start(t); vib.start(t); o.stop(t + dur + .05); vib.stop(t + dur + .05);
  }
  setIntensity(k) { this.intensity = k; }
  duck(level, seconds = .25, cutoff = 12000) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.musicDuck.gain.cancelScheduledValues(t); this.musicDuck.gain.setTargetAtTime(level, t, seconds / 3);
    this.musicTone.frequency.cancelScheduledValues(t); this.musicTone.frequency.setTargetAtTime(cutoff, t, seconds / 3);
  }
  stinger(notes, t, gain = .1, gap = .08) { notes.forEach((n, i) => this.bell({ t: t + i * gap, note: n, gain, decay: 1.6, dest: this.stingBus })); }

  /* ---------- состояние игры ---------- */
  // Музыка следует за фазой: выбор — спокойная тема, раунд — ритм, каждая заточка уплотняет аранжировку.
  setGame({ phase, level = 0, difficulty = 'medium' }) {
    this.state = { ...this.state, phase, level, difficulty };
    const k = phase === 'opened' ? 1 : phase === 'sharpened' ? Math.min(4, 2 + Math.floor(level / 2)) : 0;
    this.setIntensity(k);
    this.magicDim = phase === 'lost';
    if (this.ctx) {
      this.setFire(difficulty, phase === 'lost');
      if (phase === 'lost') this.duck(.35, .8, 700); else this.duck(1, .6, 12000);
    }
  }

  /* ---------- события ---------- */
  // Имя события → звук. t — момент бита; все звуки строятся от него.
  play(name, data = {}) {
    if (!this.ctx || !this.settings.on) return;
    const t = this.ctx.currentTime + .005;
    this.log.push(name); if (this.log.length > 200) this.log.shift();
    const fn = this.sounds[name];
    if (fn) { try { fn.call(this, t, data); } catch (e) { console.error(e); } }
  }

  get sounds() { return SOUNDS; }
}

// Каталог звуков. Ключ = бит сцены или действие интерфейса (см. docs/sound-map.md).
const SOUNDS = {
  // Ставка: монета ложится на стопку на дощатом полу; вверх — звонче и с искрой, вниз — глуше.
  'stake-up'(t) { const at = this.slot('ui', .04); this.coin({ t: at, pitch: 1.1, gain: .13 }); this.wood({ t: at, freq: 260, gain: .05, decay: .05, bright: 1400 }); this.sparkle({ t: at + .03, n: 2, spread: .1, gain: .018 }); },
  'stake-down'(t) { const at = this.slot('ui', .04); this.coin({ t: at, pitch: .84, gain: .11 }); this.wood({ t: at, freq: 200, gain: .07, decay: .06, bright: 900 }); },
  // Монета падает на стопку: звон о монеты и тихий стук доски.
  stack(t, { i = 0 }) { const at = this.slot('stack', .035); this.coin({ t: at, pitch: .9 + (i % 4) * .04, gain: .08 }); this.wood({ t: at, freq: 240, gain: .045, decay: .04, bright: 1200 }); },
  // Сложность: горн вспыхивает тягой — сильнее на сложной.
  difficulty(t, { difficulty = 'medium' }) {
    const s = { easy: .7, medium: 1, hard: 1.35 }[difficulty] ?? 1;
    this.setFire(difficulty);
    this.noise({ t, dur: .55 * s, gain: .26 * s, type: 'lowpass', freq: 200, to: 1500 * s, glide: .3, Q: 1.1, attack: .03, brown: true, dest: this.ambBus });
    for (let i = 0; i < Math.round(4 * s); i++) this.noise({ t: t + .08 + rnd() * .4, dur: .014, gain: .1, type: 'highpass', freq: 3000 + rnd() * 2500, attack: .001, dest: this.ambBus });
    this.thump({ t, freq: 72, to: 46, gain: .1 * s, decay: .35 });
  },
  // 1. Монеты со стопок на полу летят к шву крышки и падают в полый сундук.
  'stake-in'(t, { coins = 6 }) {
    for (let n = 0; n < coins; n++) {
      const at = t + n * .045;
      this.whoosh({ t: at, dur: .3, from: 1200, peak: 3600, gain: .016 });
      this.coin({ t: at + .34, pitch: .82 + rnd() * .1, gain: .075 });
      this.wood({ t: at + .34, freq: 150, gain: .045, decay: .07, bright: 520 });
    }
  },
  // 2. Сундук приоткрыт и дрожит на камне: крышка постукивает, из щели — нарастающий волшебный гул.
  charge(t) {
    for (let i = 0; i < 9; i++) { const at = t + i * .065 + rnd() * .02; this.wood({ t: at, freq: 200 + rnd() * 50, gain: .055 + i * .008, decay: .04, bright: 1100 }); }
    this.noise({ t, dur: .6, gain: .05, type: 'lowpass', freq: 160, to: 420, Q: .7, brown: true, attack: .4, curve: 'lin' }); // корпус ёрзает по камню
    this.swell({ t, dur: .65, from: 196, to: 587, gain: .05 });
    this.sparkle({ t: t + .2, n: 8, spread: .45, gain: .022 });
    this.duck(.5, .3);
  },
  // 3. Крышка распахивается: деревянный удар, скрип петель, щелчок оковки, изумрудный перелив; монеты на камень и доски.
  lid(t) {
    this.wood({ t, freq: 110, gain: .5, decay: .28, bright: 420 });
    this.noise({ t, dur: .22, gain: .08, type: 'bandpass', freq: 900, to: 420, Q: 9, attack: .01 }); // петли
    this.metal({ t: t + .01, base: 420, ratios: [1, 2.7, 5.2], decay: .3, gain: .05 }); // железная оковка
    this.harp({ t: t + .03, notes: [62, 66, 69, 74, 78, 81, 86], gap: .03, gain: .09 });
    this.bell({ t: t + .06, note: 86, gain: .05 }); this.bell({ t: t + .1, note: 93, gain: .035 });
    this.noise({ t, dur: .9, gain: .045, type: 'highpass', freq: 6500, attack: .01, dest: this.magicBus }); // сияние из пасти
    for (let i = 0; i < 10; i++) {
      const at = t + .4 + rnd() * .55, onStone = rnd() < .5;
      this.coin({ t: at, pitch: (onStone ? 1 : .86) + rnd() * .18, gain: .05 + rnd() * .03 });
      if (onStone) this.stone({ t: at, gain: .06 }); else this.wood({ t: at, freq: 230, gain: .04, decay: .04, bright: 1100 });
    }
    this.duck(1, .8);
  },
  // 4. Клинок выходит из сундука с вращением: свист и восходящая арфа.
  rise(t) {
    this.whoosh({ t, dur: .38, from: 500, peak: 2600, gain: .1 });
    this.whoosh({ t: t + .38, dur: .38, from: 600, peak: 3200, gain: .08 });
    this.harp({ t: t + .02, notes: [69, 71, 74, 76, 78, 81, 83, 86, 88, 90], gap: .065, gain: .065 });
    this.swell({ t, dur: .75, from: 330, to: 880, gain: .025 });
  },
  // Клинок встал и парит: «шинг» стали и два колокольчика.
  reveal(t) {
    this.noise({ t, dur: .3, gain: .07, type: 'bandpass', freq: 3000, to: 9000, glide: .2, Q: 3, attack: .005 });
    this.blade({ t, base: 1480, decay: 1.2, gain: .07 });
    this.bell({ t: t + .04, note: 74, gain: .055, decay: 1.6 }); this.bell({ t: t + .1, note: 81, gain: .045, decay: 1.6 });
  },
  // Ковка: горн вспыхивает, волшебный молот выплывает справа.
  windup(t) {
    this.noise({ t, dur: .45, gain: .15, type: 'lowpass', freq: 250, to: 1300, glide: .3, Q: 1, attack: .06, brown: true, dest: this.ambBus, curve: 'lin' });
    this.whoosh({ t: t + .02, dur: .32, from: 250, peak: 1100, gain: .07 });
    this.swell({ t, dur: .4, from: 440, to: 660, gain: .022 });
    this.duck(.6, .3, 5000);
  },
  // Клинок ложится ребром на стенки сундука: тонкий звон стали об оковку и деревянный отклик.
  lay(t) { this.blade({ t, base: 1250, decay: .35, gain: .05 }); this.wood({ t, freq: 190, gain: .09, decay: .07, bright: 800 }); },
  // Удар молота по клинку на сундуке: тело удара, звон клинка, отклик деревянного корпуса, искры, изумруд отзывается.
  hit(t, { index = 0, level = 0 }) {
    const p = 1 + index * .04 + Math.min(level, 10) * .012;
    this.thump({ t, freq: 115, to: 55, gain: .5 + index * .05, decay: .13 });
    this.noise({ t, dur: .025, gain: .32, type: 'bandpass', freq: 3400, Q: .8, attack: .0005 });
    this.blade({ t, base: 1050 * p, decay: .9, gain: .16 + index * .02, bright: 1.2 });
    this.wood({ t: t + .004, freq: 150, gain: .17, decay: .1, bright: 380 });
    this.noise({ t: t + .02, dur: .3, gain: .04, type: 'highpass', freq: 7000, attack: .002 });
    this.bell({ t: t + .03, note: 81 + index * 5, gain: .032, decay: 1.1 });
  },
  // Решающий замах в замедлении: музыка уходит, слышно сердце и нарастающий волшебный гул.
  tension(t, { level = 0 }) {
    this.duck(.12, .25, 800);
    const beat = 60 / 112;
    for (let i = 0; i < 2; i++) { this.thump({ t: t + i * beat, freq: 70, to: 40, gain: .45, decay: .14 }); this.thump({ t: t + i * beat + .14, freq: 62, to: 38, gain: .3, decay: .12 }); }
    this.noise({ t, dur: .72, gain: .07 + Math.min(.06, level * .012), type: 'bandpass', freq: 200, to: 2600, glide: .7, Q: 2, attack: .65, curve: 'lin' });
    this.swell({ t, dur: .72, from: 110, to: 330 + Math.min(level, 10) * 12, gain: .05 + Math.min(.03, level * .006) });
  },
  // Успех: сильнейший удар, звон клинка и мажорный перелив; с каждой заточкой выше.
  success(t, { level = 1 }) {
    const up = clampA(level - 1, 0, 6);
    this.thump({ t, freq: 110, to: 45, gain: .55, decay: .2 });
    this.noise({ t, dur: .04, gain: .38, type: 'bandpass', freq: 3600, Q: .8, attack: .0005 });
    this.blade({ t, base: 1150 + up * 40, decay: 1.5, gain: .17, bright: 1.3 });
    const root = 62 + [0, 2, 4, 5, 7, 9, 11][up];
    this.stinger([root, root + 4, root + 7, root + 12], t + .06, .1, .07);
    this.harp({ t: t + .06, notes: [root - 12, root - 5, root, root + 4, root + 7, root + 12], gap: .04, gain: .08, dest: this.stingBus });
    this.duck(.35, .2, 12000);
  },
  // Перековка: клинок меняет облик снизу вверх; у каждого вида клинка свой голос.
  reforged(t, { level = 1 }) {
    const n = Math.max(0, Math.floor(level) || 0), tier = n ? 1 + (n - 1) % 5 : 0, prestige = n ? Math.floor((n - 1) / 5) : 0;
    const v = TIER_VOICES[tier];
    this.harp({ t, notes: [...v.notes.map(x => x - 12), ...v.notes], gap: .045, gain: .065 });
    v.notes.forEach((x, i) => this.bell({ t: t + .14 + i * .06, note: x, gain: .035, decay: 1.5 }));
    if (v.color === 'steel') this.blade({ t: t + .05, base: 2100, decay: 1.1, gain: .05 });
    if (v.color === 'glass') v.notes.forEach((x, i) => this.bell({ t: t + .2 + i * .06, note: x + 12, gain: .015, decay: 1 }));
    if (v.color === 'ice') for (let i = 0; i < 12; i++) this.noise({ t: t + rnd() * .6, dur: .01, gain: .04, type: 'highpass', freq: 6000 + rnd() * 3000, attack: .0005, dest: this.magicBus });
    if (v.color === 'rune') for (const x of [50, 57]) this.tone({ t, freq: midi(x), gain: .05, attack: .15, decay: 1.4, dest: this.magicBus });
    if (v.color === 'sun') for (const x of [62, 66, 69]) this.tone({ t: t + .05, freq: midi(x), type: 'triangle', gain: .035, attack: .08, decay: 1.2, dest: this.magicBus });
    if (v.color === 'moon') this.noise({ t, dur: 1, gain: .03, type: 'highpass', freq: 8000, attack: .3, dest: this.magicBus });
    if (prestige) this.sparkle({ t: t + .2, n: 6 + prestige * 2, spread: .6, gain: .028, lo: 5 });
    this.duck(1, 1.2);
  },
  // Поломка, этап 1: трещина в замедлении — хруст стали и стеклянный треск; музыка обрывается.
  crack(t) {
    this.thump({ t, freq: 110, to: 50, gain: .5, decay: .18 });
    this.blade({ t, base: 620, decay: .45, gain: .1 });
    for (let i = 0; i < 14; i++) this.noise({ t: t + .02 + i * .017 + rnd() * .01, dur: .012, gain: .11 + rnd() * .07, type: 'highpass', freq: 2500 + rnd() * 4000, attack: .0005 });
    this.tone({ t, freq: 3200, to: 2300, glide: .25, gain: .02, attack: .01, decay: .2 });
    this.tone({ t, freq: 900, to: 300, glide: .24, type: 'sawtooth', gain: .025, attack: .01, decay: .2 });
    this.duck(0, .15, 400);
  },
  // Поломка, этап 2: сталь разлетается, волшебство гаснет нисходящими тонами, горн остывает. Ни одной «выигрышной» ноты.
  shatter(t) {
    this.thump({ t, freq: 80, to: 32, gain: .65, decay: .5 });
    this.noise({ t, dur: .5, gain: .42, type: 'lowpass', freq: 5000, to: 600, glide: .5, Q: .5, attack: .001 });
    for (let i = 0; i < 12; i++) this.metal({ t: t + rnd() * .35, base: 1400 + rnd() * 2600, ratios: [1, 2.3], decay: .25 + rnd() * .3, gain: .03 + rnd() * .03 });
    for (let i = 0; i < 8; i++) this.tone({ t: t + .02 + rnd() * .3, freq: 3000 + rnd() * 4000, gain: .02 + rnd() * .02, attack: .0008, decay: .12 + rnd() * .2 });
    this.tone({ t: t + .1, freq: midi(62), to: midi(50), glide: 1, type: 'triangle', gain: .08, attack: .02, decay: 1.2, dest: this.stingBus });
    this.tone({ t: t + .1, freq: midi(65), to: midi(53), glide: 1, type: 'triangle', gain: .055, attack: .02, decay: 1.2, dest: this.stingBus });
    this.musicHold = this.ctx.currentTime + 2.2;
    this.magicDim = true;
    this.setFire(this.state.difficulty, true);
    this.noise({ t: t + .2, dur: 1.2, gain: .12, type: 'lowpass', freq: 900, to: 200, Q: .7, attack: .05, brown: true, dest: this.ambBus }); // горн гаснет
  },
  // Части клинка: острие входит в доски (стук, щепа, дрожь), части у постамента звенят о камень, лежащая — о доски.
  land(t, { index = 0 }) {
    const at = this.slot('land', .05);
    if (index === 0) {
      this.wood({ t: at, freq: 140, gain: .2, decay: .1, bright: 700 });
      for (let i = 0; i < 6; i++) this.noise({ t: at + .005 + rnd() * .06, dur: .01, gain: .05 + rnd() * .04, type: 'bandpass', freq: 1500 + rnd() * 2000, Q: 2, attack: .0005 });
      this.quiver({ t: at + .01, freq: 190, gain: .05, decay: .55 });
    } else if (index === 2) {
      this.wood({ t: at, freq: 170, gain: .13, decay: .08, bright: 600 });
      this.blade({ t: at, base: 820, decay: .2, gain: .04 });
    } else {
      this.blade({ t: at, base: 1200 + index * 130, decay: .35, gain: .08 });
      this.stone({ t: at, gain: .1 });
    }
  },
  // Продажа: тёплый удар и перелив арфы с колокольчиками; размер праздника зависит от выплаты относительно ставки.
  payout(t, { ratio = 1.5 }) {
    const size = clampA(Math.log2(ratio) / 4, .1, 1); // ×1,5 → скромно, ×16+ → полный
    this.tone({ t, freq: midi(50), to: midi(38), glide: .3, gain: .2, attack: .005, decay: .45 });
    const notes = size < .35 ? [69, 74, 78] : size < .7 ? [66, 69, 74, 78, 81] : [62, 66, 69, 74, 78, 81, 86, 90];
    this.harp({ t, notes: notes.map(n => n - 12), gap: .05 - size * .015, gain: .07 + size * .03, dest: this.stingBus });
    this.stinger(notes, t + .05, .07 + size * .04, .075 - size * .02);
    this.noise({ t, dur: .8 + size, gain: .04 + size * .035, type: 'highpass', freq: 7000, attack: .02, dest: this.magicBus });
    this.duck(.45, .2);
  },
  // Монета долетела до баланса: звенит нотой лада, выше к последней; последняя — колокольчик.
  coin(t, { i = 0, n = 10 }) {
    const at = this.slot('coin', .028);
    this.coin({ t: at, freq: midi(pent(14 + Math.round((i / Math.max(1, n - 1)) * 4))) * .98, gain: .1 });
    if (i === n - 1) { this.bell({ t: at + .04, note: 86, gain: .05, decay: 1.2 }); this.bell({ t: at + .1, note: 93, gain: .04, decay: 1.2 }); this.duck(1, 1); }
  },
  // Новый раунд: клинок улетает вверх со свистом и искрами / части тают дымком.
  clear(t, { from = 'won' }) {
    if (from === 'won') { this.whoosh({ t: t + .1, dur: .4, from: 400, peak: 3500, gain: .12 }); this.sparkle({ t: t + .12, n: 6, spread: .35, gain: .025, lo: 3 }); }
    else { this.noise({ t, dur: .4, gain: .08, type: 'highpass', freq: 3000, to: 1500, Q: .7, attack: .05, curve: 'lin' }); this.noise({ t, dur: .35, gain: .06, type: 'bandpass', freq: 900, to: 500, Q: 1.2, attack: .05, curve: 'lin' }); }
  },
  // Крышка захлопывается: деревянный удар, щелчок замка, тихая печать волшебства.
  closed(t) {
    this.wood({ t, freq: 140, gain: .45, decay: .2, bright: 500 });
    this.metal({ t: t + .008, base: 380, ratios: [1, 2.7], decay: .25, gain: .05 });
    this.tone({ t: t + .02, freq: midi(50), gain: .04, attack: .01, decay: .6, dest: this.magicBus });
    this.bell({ t: t + .05, note: 74, gain: .02, decay: 1 });
  },
  // Сброс демо: перезвон монет.
  reset(t) { for (let i = 0; i < 8; i++) this.coin({ t: t + i * .06, freq: midi(pent(12 + i)) * .98, gain: .05 }); },
  // Пробный звук для ползунка «Эффекты»: удар молота по клинку.
  test(t) { SOUNDS.hit.call(this, t, { index: 0, level: 0 }); },
};

/* ---------- Шаблоны ---------- */
function stageHTML() {
  return `<div class="stage" data-phase="setup">
    <canvas class="scene-canvas" role="img" aria-label="Кузница"></canvas>
    <div class="hud">
      <div class="topbar"><div class="brand">${ICON_ANVIL}<span>КУЗНИЦА</span></div>
        <button class="sound-btn" type="button" data-sound-toggle aria-label="Звук" aria-haspopup="dialog" aria-expanded="false" aria-controls="mixer">${ICON_SOUND_ON}</button>
        <div class="wallet"><span class="coin-icon" aria-hidden="true"><img src="${artURL('coin')}" alt=""></span><span class="wallet-text"><small>Баланс</small><strong class="wallet-value"></strong></span></div></div>
      <div class="head-wrap"><div class="headline"></div><div class="banner-slot" aria-hidden="true"></div></div>
      <div class="focus"></div>
      <div class="panel"></div>
    </div>
    <canvas class="fx-canvas" aria-hidden="true"></canvas>
  </div>`;
}

function headlineHTML(s, op, shownMult) {
  if (s.phase === 'setup') {
    return `<span class="eyebrow">${op === 'open' ? 'Сундук открывается' : op === 'again' ? 'Готовим новый раунд' : 'Новый раунд'}</span><strong class="title">Открой сундук</strong><span class="meta"><span class="chip gold">Ставка ${money(s.stake)}</span><span class="chip chance">Шанс заточки ${pct(s.chance)}</span></span>`;
  }
  if (s.phase === 'lost') {
    return `<span class="eyebrow">Раунд завершён</span><strong class="title bad">Поломка</strong><span class="meta"><span class="chip">${weaponTier(s.level).name} разбит</span></span>`;
  }
  const label = s.phase === 'won' ? 'Финальный множитель' : op === 'upgrade' ? 'Ковка · решает удар' : 'Множитель';
  const meta = s.phase === 'won'
    ? `<span class="chip gold">Продано за ${money(s.paid)}</span>`
    : `<span class="chip chance">Шанс ${pct(s.chance)}</span><span class="chip">Дальше ${mult(s.nextMultiplier)}</span>`;
  return `<span class="eyebrow">${label}</span><strong class="mult" data-mult>${mult(shownMult)}</strong><span class="meta">${meta}</span>`;
}

function pipsHTML(level, fresh = false) {
  const tier = weaponTier(level);
  const filled = level ? 1 + (level - 1) % 5 : 0;
  return `<div class="pips" aria-label="Заточка +${level}"><div class="pips-row">${Array.from({ length: 5 }, (_, i) => `<i class="pip${i < filled ? ' on' : ''}${fresh && i === filled - 1 ? ' new' : ''}"></i>`).join('')}</div><span class="pips-label">Заточка +${level}${tier.prestige ? ' ★'.repeat(Math.min(tier.prestige, 3)) : ''}</span></div>`;
}

function panelHTML(s, op, busy, { preview = false, freshPip = false } = {}) {
  const fixed = preview ? ' tabindex="-1"' : '';
  const off = flag => flag ? ' disabled' : '';
  if (s.phase === 'setup') {
    const idx = DIFFS.indexOf(s.difficulty);
    const cantOpen = !s.canOpen || busy;
    return `<div class="setup">
      <div style="--i:0"><span class="field-label" id="stake-label${preview ? '-p' : ''}">Ставка</span>
        <div class="stake" role="group" aria-labelledby="stake-label${preview ? '-p' : ''}">
          <button class="step" type="button" data-action="decrease" aria-label="Уменьшить ставку"${off(busy || s.stake === STAKES[0])}${fixed}>−</button>
          <output class="stake-value" aria-label="Ставка"><span class="num">${money(s.stake)}</span></output>
          <button class="step" type="button" data-action="increase" aria-label="Увеличить ставку"${off(busy || s.stake === STAKES.at(-1))}${fixed}>+</button>
        </div></div>
      <div style="--i:1"><span class="field-label">Сложность <em>шанс заточки ${pct(s.chance)}</em></span>
        <div class="segments" role="group" aria-label="Сложность" style="--idx:${idx}"><span class="seg-thumb" aria-hidden="true"></span>
          ${DIFFS.map(d => `<button class="segment" type="button" data-difficulty="${d}" aria-pressed="${s.difficulty === d}"${off(busy)}${fixed}>${PROFILES[d].label}</button>`).join('')}
        </div></div>
      <button class="btn btn-open" type="button" style="--i:2" data-action="open"${off(cantOpen)}${op === 'open' ? ' aria-busy="true"' : ''}${fixed}>${ICON_CHEST}<span>${op === 'open' ? 'Открываем…' : s.balance < s.stake && !busy ? 'Не хватает средств' : 'Открыть сундук'}</span><b>${money(s.stake)}</b></button>
    </div>`;
  }
  if (s.phase === 'opened' || s.phase === 'sharpened') {
    const tier = weaponTier(s.level);
    const working = op === 'upgrade';
    return `<div class="weapon-card" style="--i:0;--accent:${tier.accent}"><div class="weapon-name"><span class="kicker">${working ? 'В работе' : 'Твоё оружие'}</span><h2>${tier.name}</h2></div>${pipsHTML(s.level, freshPip)}</div>
      <div class="actions" style="--i:1">
        <button class="btn btn-sell" type="button" data-action="sell"${off(busy)}${op === 'sell' ? ' aria-busy="true"' : ''}${fixed}><span>${ICON_COIN}Продать</span><b>${money(s.cashValue)}</b></button>
        <button class="btn btn-upgrade${!s.canUpgrade && !busy ? ' limit' : ''}" type="button" data-action="upgrade"${off(busy || !s.canUpgrade)}${working ? ' aria-busy="true"' : ''}${fixed}><span>${ICON_HAMMER}${working ? 'Куём…' : s.canUpgrade || busy ? 'Улучшить' : 'Предел'}</span><b>${mult(s.nextMultiplier)}</b><small>шанс ${pct(s.chance)}</small></button>
      </div>`;
  }
  const won = s.phase === 'won';
  return `<div class="result" style="--i:0"><span class="kicker">${won ? 'Твой выигрыш' : 'Выигрыш раунда'}</span><strong class="result-sum">${money(won ? s.paid : 0)}</strong><p>${won ? (op === 'sell' ? 'Монеты летят на баланс…' : 'Зачислено на баланс') : 'Клинок не выдержал ковки'}</p></div>
    <button class="btn btn-again" type="button" style="--i:1" data-action="again"${off(busy)}${fixed}>${ICON_AGAIN}<span>Ещё раунд</span></button>`;
}

function sceneLabel(s) {
  const name = weaponTier(s.level).name;
  return s.phase === 'setup' ? 'Закрытый сундук на каменном постаменте, рядом стопки монет ставки' : s.phase === 'lost' ? `${name} разбит, части лежат у постамента` : s.phase === 'won' ? `${name} продан, золотое сияние` : `${name}, заточка ${s.level}, парит над открытым сундуком`;
}

function fitNumbers(scope) {
  for (const el of scope.querySelectorAll('.mult, .title, .result-sum, .wallet-value, .stake-value .num, .btn b, .weapon-name h2')) {
    el.style.fontSize = '';
    const box = el.parentElement.clientWidth - (el.matches('.btn b') ? 12 : 0);
    if (!box || el.scrollWidth <= box) continue;
    const size = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = `${Math.max(13, Math.floor(size * box / el.scrollWidth))}px`;
  }
}

// Звук идёт за кадром: каждый бит сцены озвучивается в тот же момент, что и анимация.
function soundBeat(name, data = {}) {
  const s = game.snapshot();
  if (name === 'hit' || name === 'tension' || name === 'success' || name === 'reforged') data = { ...data, level: s.level };
  if (name === 'payout') data = { ...data, ratio: s.paid / Math.max(1, s.stake) };
  audio.play(name, data);
  if (name === 'closed') audio.setGame(s);
}

let busy = false;

const display = { balance: game.balance, mult: 0 };
let lastPhase = null;

function layoutScene() {
  // Верх панели прозрачен: сцена занимает и эту полосу, чтобы клинок был крупнее.
  const s = stage.getBoundingClientRect(), f = focusEl.getBoundingClientRect();
  scene.setFocus(f.top - s.top, f.bottom - s.top + 22);
}
new ResizeObserver(() => { layoutScene(); fitNumbers(stage); }).observe(stage);

function render({ enter = null, freshPip = false } = {}) {
  const s = game.snapshot();
  const focused = document.activeElement;
  const keep = focused && stage.contains(focused) ? (focused.dataset.action || focused.dataset.difficulty) : null;
  stage.dataset.phase = s.phase;
  stage.setAttribute('aria-busy', String(busy));
  headline.innerHTML = headlineHTML(s, op, display.mult);
  panel.innerHTML = panelHTML(s, op, busy, { freshPip });
  walletValue.textContent = money(display.balance);
  stage.querySelector('.scene-canvas').setAttribute('aria-label', sceneLabel(s));
  document.querySelector('#reset-demo').disabled = busy;
  const shouldEnter = enter ?? (lastPhase !== null && lastPhase !== s.phase);
  lastPhase = s.phase;
  if (shouldEnter && !reducedMotion) {
    panel.classList.remove('enter'); void panel.offsetWidth; panel.classList.add('enter');
    if (!headline.parentElement.classList.contains('show-banner')) headline.animate([{ opacity: 0, transform: 'translateY(-8px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.2,.9,.25,1.1)' });
  } else panel.classList.remove('enter');
  fitNumbers(stage);
  if (keep) {
    let target = panel.querySelector(`[data-action="${keep}"], [data-difficulty="${keep}"]`);
    if (target?.disabled && (keep === 'increase' || keep === 'decrease')) target = panel.querySelector(`[data-action="${keep === 'increase' ? 'decrease' : 'increase'}"]`);
    if (target && !target.disabled) target.focus({ preventScroll: true });
  }
}

function focusAction(name) {
  const target = panel.querySelector(`[data-action="${name}"]`);
  if (target && !target.disabled && stage.contains(document.activeElement) || target && document.activeElement === document.body) target.focus({ preventScroll: true });
}

function announce() {
  const s = game.snapshot();
  announcement.textContent = s.phase === 'lost' ? `${weaponTier(s.level).name} сломан. Выигрыш 0 рублей.` : s.phase === 'won' ? `Выигрыш ${money(s.paid)} зачислен на баланс.` : s.phase === 'setup' ? 'Новый раунд. Выбери ставку и сложность.' : `${weaponTier(s.level).name}. Множитель ${mult(s.multiplier)}. Продать за ${money(s.cashValue)} или улучшить с шансом ${pct(s.chance)}.`;
}

/* ---------- Анимация интерфейса ---------- */
const rollTokens = {};
function roll(key, from, to, ms, format, selector) {
  const token = rollTokens[key] = (rollTokens[key] || 0) + 1;
  if (reducedMotion || from === to) { display[key] = to; const el = stage.querySelector(selector); if (el) el.textContent = format(to); return Promise.resolve(); }
  const started = performance.now();
  return new Promise(resolve => {
    const tick = now => {
      if (rollTokens[key] !== token) { resolve(); return; }
      const t = Math.min(1, (now - started) / ms);
      const e = 1 - (1 - t) ** 3;
      display[key] = Math.round(from + (to - from) * e);
      const el = stage.querySelector(selector);
      if (el) el.textContent = format(display[key]);
      if (t < 1) requestAnimationFrame(tick); else { display[key] = to; fitNumbers(stage); resolve(); }
    };
    requestAnimationFrame(tick);
  });
}
function punch(selector, scale = 1.18) {
  if (reducedMotion) return;
  stage.querySelector(selector)?.animate([{ transform: 'scale(1)' }, { transform: `scale(${scale})`, offset: .35 }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
}
function shakeHud(size) {
  if (reducedMotion) return;
  hud.classList.remove('shake-s', 'shake-m', 'shake-l'); void hud.offsetWidth; hud.classList.add(`shake-${size}`);
}
hud.addEventListener('animationend', event => { if (event.target === hud) hud.classList.remove('shake-s', 'shake-m', 'shake-l'); });
function banner(title, sub, kind) {
  const el = document.createElement('div');
  el.className = `banner ${kind}`;
  el.innerHTML = `<b>${title}</b>${sub ? `<span>${sub}</span>` : ''}`;
  bannerSlot.replaceChildren(el);
  const wrap = bannerSlot.parentElement;
  for (const animation of headline.getAnimations()) animation.cancel();
  wrap.classList.add('show-banner');
  clearTimeout(banner.timer);
  banner.timer = setTimeout(() => { el.remove(); wrap.classList.remove('show-banner'); }, reducedMotion ? 1200 : 1500);
}
function walletPulse() {
  walletEl.classList.remove('pulse'); void walletEl.offsetWidth; walletEl.classList.add('pulse');
}
function walletPoint() {
  const s = stage.getBoundingClientRect(), c = walletEl.querySelector('.coin-icon').getBoundingClientRect();
  return { x: c.left + c.width / 2 - s.left, y: c.top + c.height / 2 - s.top };
}
function ripple(button, event) {
  if (reducedMotion || !button.classList.contains('btn')) return;
  const r = button.getBoundingClientRect();
  const dot = document.createElement('i');
  dot.className = 'ripple';
  const size = Math.max(r.width, r.height) * 2.2;
  const x = event.detail ? event.clientX - r.left : r.width / 2, y = event.detail ? event.clientY - r.top : r.height / 2;
  dot.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
  button.append(dot);
  setTimeout(() => dot.remove(), 520);
}
function slideStake(before, direction) {
  const box = panel.querySelector('.stake-value');
  if (!box || reducedMotion) return;
  const ghost = document.createElement('span');
  ghost.className = 'ghost'; ghost.textContent = before;
  box.append(ghost);
  const d = direction > 0 ? -1 : 1;
  ghost.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: `translateY(${d * 100}%)`, opacity: 0 }], { duration: 240, easing: 'ease-in', fill: 'forwards' }).finished.then(() => ghost.remove());
  box.querySelector('.num').animate([{ transform: `translateY(${-d * 100}%)`, opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.2,.9,.3,1.3)' });
  box.animate([{ boxShadow: 'inset 0 2px 6px #000a, 0 0 0 0 #ffd36b88' }, { boxShadow: 'inset 0 2px 6px #000a, 0 0 0 8px #ffd36b00' }], { duration: 420 });
}

/* ---------- Действия ---------- */
async function doOpen() {
  const prev = game.snapshot();
  if (!game.beginOpen()) return;
  busy = true; op = 'open';
  render();
  beatHandler = name => {
    if (name === 'stake-in') { roll('balance', prev.balance, game.snapshot().balance, 600, money, '.wallet-value'); walletPulse(); }
    if (name === 'lid') shakeHud('m');
    if (name === 'reveal') {
      game.resolveOpen();
      display.mult = 0;
      render({ enter: true });
      banner('Новое оружие', weaponTier(0).name, 'steel');
      roll('mult', 0, game.multiplier, 650, mult, '[data-mult]').then(() => punch('[data-mult]'));
    }
  };
  try { await scene.open(); }
  finally {
    if (game.snapshot().busy) { game.resolveOpen(); }
    beatHandler = null; busy = false; op = null;
    display.balance = game.balance; display.mult = game.multiplier;
    render(); focusAction('upgrade'); announce(); audio.setGame(game.snapshot());
  }
}

async function doUpgrade() {
  const prev = game.snapshot();
  if (!game.beginUpgrade()) return;
  busy = true; op = 'upgrade';
  render();
  beatHandler = name => {
    if (name === 'hit') shakeHud('s');
    if (name === 'tension') stage.classList.add('tension');
  };
  let next = null;
  try {
    await scene.upgradeWindup();
    game.resolveUpgrade();
    next = game.snapshot();
    const success = next.phase === 'sharpened';
    stage.classList.remove('tension');
    beatHandler = name => {
      if (name === 'success') {
        shakeHud('m');
        banner('Успех!', `Заточка +${next.level}`, 'good');
        render({ enter: false });
        roll('mult', prev.multiplier, next.multiplier, 700, mult, '[data-mult]').then(() => punch('[data-mult]', 1.22));
      }
      if (name === 'reforged') { render({ enter: true, freshPip: true }); }
      if (name === 'crack') shakeHud('s');
      if (name === 'shatter') { shakeHud('l'); banner('Поломка', `${weaponTier(prev.level).name} разбит`, 'bad'); display.mult = 0; render({ enter: true }); }
      if (name === 'land') shakeHud('s');
    };
    await scene.upgradeResult(success, next.level);
  } finally {
    stage.classList.remove('tension');
    beatHandler = null; busy = false; op = null;
    display.mult = game.multiplier;
    render(); focusAction(game.active ? 'upgrade' : 'again'); announce(); audio.setGame(game.snapshot());
  }
}

async function doSell() {
  const prev = game.snapshot();
  if (!game.sell()) return;
  const paid = game.paid;
  busy = true; op = 'sell';
  render({ enter: true });
  const ratio = paid / Math.max(1, prev.stake);
  const coins = Math.max(8, Math.min(26, Math.round(6 + Math.log2(ratio + 1) * 4)));
  let arrived = 0;
  beatHandler = name => {
    if (name === 'payout') { banner(`+${money(paid)}`, 'Клинок продан', 'gold'); punch('.result-sum', 1.15); }
    if (name === 'coin') {
      arrived += 1;
      display.balance = arrived >= coins ? prev.balance + paid : prev.balance + Math.round(paid * arrived / coins / 100) * 100;
      walletValue.textContent = money(display.balance);
      walletPulse();
    }
  };
  try { await scene.sell(paid, coins, walletPoint); }
  finally {
    beatHandler = null; busy = false; op = null;
    display.balance = game.balance;
    render(); focusAction('again'); announce(); audio.setGame(game.snapshot());
  }
}

async function doAgain() {
  const prev = game.snapshot();
  if (!game.again()) return;
  busy = true; op = 'again';
  // До закрытия сундука панель финала остаётся на месте, кнопка показывает процесс.
  const again = panel.querySelector('[data-action="again"]');
  if (again) { again.disabled = true; again.setAttribute('aria-busy', 'true'); }
  document.querySelector('#reset-demo').disabled = true;
  stage.setAttribute('aria-busy', 'true');
  const stakeIndex = STAKES.indexOf(game.stake);
  beatHandler = name => { if (name === 'closed') { shakeHud('s'); display.mult = 0; render({ enter: true }); } };
  try { await scene.again(prev.phase, stakeIndex); }
  finally { beatHandler = null; busy = false; op = null; display.mult = 0; render(); focusAction('open'); announce(); audio.setGame(game.snapshot()); }
}

async function doReset() {
  const prev = game.snapshot();
  game.reset();
  busy = true; op = 'again';
  const stakeIndex = STAKES.indexOf(game.stake);
  beatHandler = name => { if (name === 'closed') { display.mult = 0; render({ enter: true }); } };
  if (prev.phase === 'setup') render({ enter: true });
  else {
    for (const button of panel.querySelectorAll('button')) button.disabled = true;
    panel.querySelector('[data-action="again"]')?.setAttribute('aria-busy', 'true');
    document.querySelector('#reset-demo').disabled = true;
    stage.setAttribute('aria-busy', 'true');
  }
  roll('balance', display.balance, game.balance, 700, money, '.wallet-value').then(walletPulse);
  audio.play('reset');
  try {
    if (prev.phase === 'setup') { scene.setDifficulty(game.difficulty); scene.stake(stakeIndex, 0); await new Promise(r => setTimeout(r, reducedMotion ? 0 : 450)); }
    else await scene.again(prev.phase, stakeIndex);
  } finally { beatHandler = null; busy = false; op = null; display.balance = game.balance; display.mult = 0; render(); announce(); audio.setGame(game.snapshot()); }
}

stage.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || button.disabled || busy || !stage.contains(button)) return;
  ripple(button, event);
  if (button.dataset.difficulty) {
    const before = DIFFS.indexOf(game.difficulty);
    if (!game.setDifficulty(button.dataset.difficulty)) return;
    render();
    const after = DIFFS.indexOf(game.difficulty);
    if (!reducedMotion) panel.querySelector('.seg-thumb')?.animate([{ transform: `translateX(${before * 100}%)` }, { transform: `translateX(${after * 100}%) scaleX(1.06)`, offset: .7 }, { transform: `translateX(${after * 100}%)` }], { duration: 320, easing: 'cubic-bezier(.3,.9,.3,1)' });
    scene.setDifficulty(game.difficulty);
    audio.play('difficulty', { difficulty: game.difficulty });
    audio.setGame(game.snapshot());
    return;
  }
  const action = button.dataset.action;
  if (action === 'increase' || action === 'decrease') {
    const before = money(game.stake);
    const dir = action === 'increase' ? 1 : -1;
    if (!game.changeStake(dir)) return;
    render();
    slideStake(before, dir);
    scene.stake(STAKES.indexOf(game.stake), dir);
    audio.play(dir > 0 ? 'stake-up' : 'stake-down');
    return;
  }
  if (action === 'open') doOpen();
  else if (action === 'upgrade') doUpgrade();
  else if (action === 'sell') doSell();
  else if (action === 'again') doAgain();
});
document.querySelector('#reset-demo').addEventListener('click', () => { if (!busy) doReset(); });

render({ enter: false });
scene.setState({ ...game.snapshot(), stakeIndex: STAKES.indexOf(game.stake) });
layoutScene();
artReady.then(() => { layoutScene(); fitNumbers(stage); });

/* ---------- Пять состояний ---------- */
const base = { balance: 115000, stake: 10000, difficulty: 'medium', multiplier: 150, nextMultiplier: 300, cashValue: 15000, chance: .5, busy: false, operation: null, canOpen: false, canUpgrade: true, paid: 0, level: 0 };
const screens = [
  { index: '01', name: 'Выбор', caption: 'ставка и сложность', state: { ...base, phase: 'setup', balance: 125000, multiplier: 0, canOpen: true } },
  { index: '02', name: 'Открытие', caption: 'клинок из сундука', state: { ...base, phase: 'opened' } },
  { index: '03', name: 'Заточка', caption: 'успех, клинок изменился', state: { ...base, phase: 'sharpened', multiplier: 300, nextMultiplier: 600, cashValue: 30000, level: 1 } },
  { index: '04А', name: 'Выигрыш', caption: 'продажа', state: { ...base, phase: 'won', balance: 145000, multiplier: 300, paid: 30000, level: 1 } },
  { index: '04Б', name: 'Поломка', caption: 'неудачная заточка', state: { ...base, phase: 'lost', multiplier: 0, level: 1 } },
];
let previews = null;
function buildPreviews() {
  if (previews) return;
  const strip = document.querySelector('#states-root');
  strip.innerHTML = screens.map(({ index, name, caption }) => `<article class="state-card"><h2><i>${index}</i>${name}<small>${caption}</small></h2><div inert>${stageHTML()}</div></article>`).join('');
  previews = [...strip.querySelectorAll('.stage')].map((el, i) => {
    const { state } = screens[i];
    el.dataset.phase = state.phase;
    el.querySelector('.headline').innerHTML = headlineHTML(state, null, state.multiplier);
    el.querySelector('.panel').innerHTML = panelHTML(state, null, false, { preview: true });
    el.querySelector('.wallet-value').textContent = money(state.balance);
    el.querySelector('.scene-canvas').setAttribute('aria-label', sceneLabel(state));
    const preview = new ForgeScene(el.querySelector('.scene-canvas'), { fx: el.querySelector('.fx-canvas'), preview: true });
    const layout = () => { const s = el.getBoundingClientRect(), f = el.querySelector('.focus').getBoundingClientRect(); preview.setFocus(f.top - s.top, f.bottom - s.top + 22); fitNumbers(el); };
    new ResizeObserver(layout).observe(el);
    layout();
    preview.setState({ ...state, stakeIndex: STAKES.indexOf(state.stake) });
    return preview;
  });
}

/* ---------- Звук: панель громкости ---------- */
const CHANNELS = [['music', 'Музыка', 'тема мастерской'], ['sfx', 'Эффекты', 'удары, сундук, монеты'], ['amb', 'Окружение', 'горн, лес за окном, светлячки']];
function mixerHTML(id) {
  return `<div class="mixer-head"><b id="${id}-title">Звук</b><button class="mixer-power" type="button" data-sound-power aria-pressed="true"><i aria-hidden="true"></i><span>Включён</span></button></div>
    ${CHANNELS.map(([key, name, hint]) => `<label class="mixer-row"><span class="mixer-label"><b>${name}</b><small>${hint}</small></span><input type="range" min="0" max="100" step="5" data-channel="${key}" aria-label="${name}"><output data-out="${key}"></output></label>`).join('')}`;
}
const mixer = document.createElement('div');
mixer.className = 'mixer'; mixer.id = 'mixer'; mixer.hidden = true;
mixer.setAttribute('role', 'dialog'); mixer.setAttribute('aria-labelledby', 'mixer-title');
mixer.innerHTML = mixerHTML('mixer');
root.append(mixer);
const soundBtn = stage.querySelector('[data-sound-toggle]');

function syncAudioUI() {
  const st = audio.settings;
  for (const scope of document.querySelectorAll('.mixer')) {
    scope.classList.toggle('off', !st.on);
    const power = scope.querySelector('[data-sound-power]');
    power.setAttribute('aria-pressed', String(st.on));
    power.querySelector('span').textContent = st.on ? 'Включён' : 'Выключен';
    for (const input of scope.querySelectorAll('[data-channel]')) {
      const v = Math.round(st[input.dataset.channel] * 100);
      if (document.activeElement !== input) input.value = v;
      input.style.setProperty('--fill', `${v}%`);
      scope.querySelector(`[data-out="${input.dataset.channel}"]`).textContent = `${v}%`;
    }
  }
  soundBtn.innerHTML = st.on ? ICON_SOUND_ON : ICON_SOUND_OFF;
  soundBtn.classList.toggle('muted', !st.on);
  soundBtn.setAttribute('aria-label', st.on ? 'Звук включён, настройки' : 'Звук выключен, настройки');
}
audio.onChange(syncAudioUI);

function openMixer(open) {
  mixer.hidden = !open;
  soundBtn.setAttribute('aria-expanded', String(open));
  if (open) {
    // Панель открывается под кнопкой звука, стрелка указывает на неё.
    const r = root.getBoundingClientRect(), b = soundBtn.getBoundingClientRect();
    mixer.style.top = `${Math.round(b.bottom - r.top + 10)}px`;
    mixer.style.setProperty('--arrow-right', `${Math.round(r.right - 12 - (b.left + b.width / 2) - 6)}px`);
    if (!reducedMotion) mixer.animate([{ opacity: 0, transform: 'translateY(-6px) scale(.97)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: 'cubic-bezier(.2,.9,.3,1)' });
    mixer.querySelector('[data-sound-power]').focus({ preventScroll: true });
  }
}
soundBtn.addEventListener('click', () => openMixer(mixer.hidden));
document.addEventListener('pointerdown', event => { if (!mixer.hidden && !mixer.contains(event.target) && !soundBtn.contains(event.target)) openMixer(false); });
document.addEventListener('keydown', event => { if (event.key === 'Escape' && !mixer.hidden) { openMixer(false); soundBtn.focus(); } });

// Браузер даёт звук только после жеста: первое касание или клавиша создаёт звуковой контекст.
for (const type of ['pointerdown', 'keydown']) document.addEventListener(type, () => { audio.unlock(); audio.setGame(game.snapshot()); }, { capture: true, once: true });
document.addEventListener('pointerdown', () => audio.unlock(), { capture: true });
document.addEventListener('click', event => {
  const power = event.target.closest('[data-sound-power]');
  if (power) { audio.set('on', !audio.settings.on); if (audio.settings.on) audio.play('test'); }
});
document.addEventListener('input', event => {
  const input = event.target.closest('[data-channel]');
  if (input) audio.set(input.dataset.channel, input.value / 100);
});
document.addEventListener('change', event => {
  const input = event.target.closest('[data-channel]');
  if (input?.dataset.channel === 'sfx') audio.play('test');
});

let soundsPreview = null;

function setView(withEffect = false) {
  const view = location.hash === '#states' ? 'states' : 'play';
  document.querySelector('#play-view').hidden = view !== 'play';
  document.querySelector('#states-view').hidden = view !== 'states';
  for (const link of document.querySelectorAll('[data-view]')) {
    if (link.dataset.view === view) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
  }
  openMixer(false);
  if (view === 'states') artReady.then(buildPreviews);
  else { layoutScene(); fitNumbers(stage); }
  if (!busy) audio.setGame(game.snapshot());
  if (withEffect && !reducedMotion) document.querySelector(`#${view}-view`).animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.9,.3,1)' });
}
syncAudioUI();
window.addEventListener('hashchange', () => setView(true));
setView();
if (document.fonts?.ready) document.fonts.ready.then(() => { fitNumbers(stage); layoutScene(); });

</script>
</body>
